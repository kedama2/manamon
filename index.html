      };
    },

    // ---------- ふ化 ----------
    async hatch() {
      const m = G.active();
      if (!m || m.stage !== 0 || F.busy) return;
      F.busy = true;
      const ov = MM.ui.open(`<h3>おや…？</h3><div id="hx">${MM.art.html(m, { size: 170, cls: 'is-hatching' })}</div><p id="hmsg">たまごの ようすが…！</p><div class="modal-actions" id="hact"></div>`, { center: true, locked: true });
      for (let i = 0; i < 3; i++) { MM.sfx.play('wobble'); MM.buzz(40); await wait(600); }
      MM.fx.flash();
      MM.sfx.play('hatch');
      MM.buzz([60, 40, 120]);
      const sp = m.species;
      u.$('#hx', ov).innerHTML = `<div class="evo-stage"><div class="evo-rays"></div>${MM.art.html({ species: sp, stage: 1 }, { size: 170, cls: 'is-happy' })}</div>`;
      ov.querySelector('h3').textContent = 'うまれた！';
      u.$('#hmsg', ov).innerHTML = `<b>${u.esc(MM.art.species(sp).label)}</b>の あかちゃんだ！ なまえを つけてあげよう。`;
      u.$('#hact', ov).innerHTML = `<input class="input" id="hname" maxlength="12" value="${u.esc(MM.art.formName(sp, 1))}" aria-label="なまえ" style="max-width:220px"><button class="btn btn-primary" data-x="ok">この なまえにする</button>`;
      const c = MM.fx.center(u.$('#hx', ov));
      MM.fx.burst(c.x, c.y, { emojis: ['✨', '🎉', '⭐'], count: 22, dist: 140 });
      MM.fx.confetti(60);
      ov.querySelector('[data-x="ok"]').onclick = async () => {
        const r = G.hatch(u.$('#hname', ov).value);
        MM.ui.close(ov);
        F.busy = false;
        MM.refresh({ habitat: true });
        for (let i = 0; i < r.pend; i++) { const e = G.evolveOnce(); if (e) await F.evolve(e.from, e.to); }
      };
    },

    // ---------- 進化 ----------
    evolve(from, to) {
      return new Promise(async (resolve) => {
        const m = G.active();
        if (!m) { resolve(); return; }
        const oldH = MM.art.html({ species: m.species, stage: from }, { size: 180 });
        const newH = MM.art.html({ species: m.species, stage: to }, { size: 180 });
        const ov = MM.ui.open(`<h3>…あれ？</h3><div class="evo-stage" id="evo">${oldH}</div><p id="emsg">${u.esc(m.name)}の ようすが…！</p><div class="modal-actions" id="eact"></div>`, { center: true, locked: true });
        const box = u.$('#evo', ov);
        let flip = false;
        for (const ms of [420, 380, 330, 280, 230, 190, 160, 130, 110, 90, 80, 70]) {
          flip = !flip;
          box.innerHTML = flip ? newH : oldH;
          box.firstElementChild.classList.add('silhouette');
          MM.sfx.lib.tap && MM.state.profile.sound && MM.sfx.tone(500 + (flip ? 300 : 0), 0, 0.05, 'triangle', 0.05);
          await wait(ms);
        }
        MM.fx.flash();
        MM.sfx.play('evolve');
        MM.buzz([80, 50, 160]);
        box.innerHTML = `<div class="evo-rays"></div>${MM.art.html({ species: m.species, stage: to }, { size: 180, cls: 'is-happy' })}`;
        ov.querySelector('h3').innerHTML = '<span class="evo-title">しんか した！</span>';
        u.$('#emsg', ov).innerHTML = `${u.esc(m.name)}は <b>${u.esc(MM.art.formName(m.species, to))}</b>（${MM.art.stageLabel(to)}）に しんかした！<br><span class="small muted">${u.esc(MM.art.desc(m.species, to))}</span>`;
        u.$('#eact', ov).innerHTML = '<button class="btn btn-sun" data-x="ok">やったね！</button>';
        const c = MM.fx.center(box);
        MM.fx.burst(c.x, c.y, { emojis: ['✨', '⭐', '🌟', '💫'], count: 26, dist: 160 });
        MM.fx.confetti(90);
        ov.querySelector('[data-x="ok"]').onclick = () => { MM.ui.close(ov); MM.refresh({ habitat: true }); resolve(); };
      });
    },

    // ---------- 学期の切りかえ ----------
    async transition(t) {
      if (F.busy) return;
      F.busy = true;
      if (t.m) {
        const m = t.m;
        await new Promise((resolve) => {
          const ov = MM.ui.open(`<h3>${MM.sem.label(t.from)} おつかれさま！</h3>
            ${MM.art.html(m, { size: 150, cls: m.stage ? 'is-happy' : '' })}
            <p><b>${u.esc(m.stage ? m.name : MM.art.formName(m.species, 0))}</b>は ${MM.art.stageLabel(m.stage)}のすがたで、チームの なかまに なりました。</p>
            <p class="small muted">この学期に とった単位：${m.credits || 0}単位</p>
            <div class="modal-actions"><button class="btn btn-primary" data-x="ok">つぎへ</button></div>`, { center: true, locked: true });
          ov.querySelector('[data-x="ok"]').onclick = () => { MM.ui.close(ov); resolve(); };
        });
        G.freeze(m);
        MM.sfx.play('pass');
        const left = G.leftovers(t.from);
        if (!left.length) G.cleanTT();
        if (left.length) {
          await new Promise((resolve) => {
            const ov = MM.ui.open(`<h3>のこっている科目</h3><p>まだ単位GETしていない科目です。今学期も続ける（再試験など）ものに チェックしてください。</p>
              <div class="stack" style="text-align:left;margin-top:8px">${left.map((s) => `<label class="list-row" style="padding:6px 0"><input type="checkbox" value="${s.uid}" checked> <span class="grow">${u.esc(s.name)}</span></label>`).join('')}</div>
              <p class="note">再試験は、科目登録した学期に単位をとれなかったとき、次の学期に1回だけ受けられます（登録・授業料なし）。</p>
              <div class="modal-actions"><button class="btn btn-primary" data-x="ok">きめた</button></div>`, { center: true, locked: true });
            ov.querySelector('[data-x="ok"]').onclick = () => {
              const ids = u.$$('input[type=checkbox]', ov).filter((c) => c.checked).map((c) => c.value);
              G.carryOver(left.filter((s) => ids.includes(s.uid)));
              MM.ui.close(ov);
              resolve();
            };
          });
        }
      }
      F.busy = false;
      F.chooseEgg(`${MM.sem.label(t.to)}の たまご`, () => { MM.refresh({ habitat: true }); MM.toast('新しい学期が はじまりました！', { big: true }); });
    },

    // ---------- モンスター全部みる（Codex の確認用） ----------
    gallery() {
      const rows = MM.art.allSpecies().map((sp) => `<div class="group-h"><span>${u.esc(sp.label)}（${sp.id}）</span><span>${(window.MONSTER_ART || {})[sp.id] ? '本番の絵あり' : '仮の絵'}</span></div>
        <div class="gallery">${[0, 1, 2, 3, 4].map((st) => `<figure>${MM.art.html({ species: sp.id, stage: st }, { size: 92 })}<figcaption>${st}：${u.esc(MM.art.formName(sp.id, st))}</figcaption></figure>`).join('')}</div>`).join('');
      const ov = MM.ui.open(`<h3>モンスター図鑑（ぜんぶ）</h3>
        <div class="row-wrap" style="margin-bottom:8px"><button class="btn btn-sm" data-g="is-eating">たべる</button><button class="btn btn-sm" data-g="is-happy">よろこぶ</button><button class="btn btn-sm" data-g="is-bath">おふろ</button><button class="btn btn-sm" data-g="is-play">あそぶ</button><button class="btn btn-sm" data-g="is-sad">しょんぼり</button><button class="btn btn-sm" data-g="is-hatching">ふ化</button><button class="btn btn-sm" data-g="silhouette">シルエット</button></div>
        ${rows}<div class="modal-actions"><button class="btn" data-x="close">とじる</button></div>`, {});
      u.$$('[data-g]', ov).forEach((b) => { b.onclick = () => u.$$('.mon', ov).forEach((m) => MM.fx.mood(m, b.dataset.g, 1800)); });
      ov.querySelector('[data-x="close"]').onclick = () => MM.ui.close(ov);
    },
  });
})();

</script>
<script>
/* まなモン：ボタンの動き（勉強の記録・ごはん・おせわ・なでる）と おためしデータ */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const A = (MM.act = MM.act || {});
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const say = (t, ms) => MM.views && MM.views.say && MM.views.say(t, ms);
  const monEl = () => u.$('#activeWrap .mon');
  const pointOf = (el) => (el && el.nodeType ? MM.fx.center(el) : el);

  // 勉強したときの ごほうび演出
  function rewardFx(from, res) {
    const pt = pointOf(from);
    const f = res.food;
    MM.sfx.play(f.rarity ? 'rare' : 'get');
    MM.buzz(30);
    MM.fx.burst(pt.x, pt.y, { emojis: f.rarity ? ['🌟', '✨', '💫'] : ['✨', '⭐'], count: f.rarity ? 18 : 10, dist: 80 });
    MM.fx.floatText(pt.x, pt.y - 12, f.rarity === 2 ? 'ちょうレア！' : f.rarity ? 'レア！' : '+1');
    MM.toast(`${f.emoji} <b>${f.name}</b> をゲット！`, { big: f.rarity > 0 });
    return MM.fx.flyTo(pt, u.$('#foodPill'), f.emoji).then(() => MM.updateTop());
  }
  function popTick(uid) {
    const card = u.$(`.subj[data-uid="${uid}"]`), s = G.findSubject(uid);
    if (!card || !s) return;
    const t = card.querySelectorAll('.ticks i')[s.done - 1];
    if (t) t.classList.add('pop');
  }
  async function afterLesson(res) {
    if (res.allDone) MM.toast('ぜんぶ おわった！ 試験に合格したら「単位GET」を押してね', { ms: 3600 });
    if (res.hatchReady) { await wait(900); MM.flow.hatch(); }
    else if (G.active() && G.active().stage === 0) say(G.speech());
  }

  A.lesson = async (el) => {
    const uid = el.dataset.uid;
    const pt = pointOf(el);
    const res = G.completeLesson(uid);
    if (!res || res.full) return;
    const fx = rewardFx(pt, res);
    MM.refresh();
    popTick(uid);
    await fx;
    afterLesson(res);
  };
  A.planDone = async (el) => {
    const pt = pointOf(el);
    const r = G.togglePlanDone(el.dataset.date, el.dataset.uid);
    MM.refresh();
    if (r.res && r.res.food) { await rewardFx(pt, r.res); afterLesson(r.res); }
    else MM.sfx.play('tap');
  };
  A.tsushin = (el) => {
    const pt = pointOf(el);
    const r = G.toggleTsushin(el.dataset.uid);
    if (!r) return;
    MM.refresh();
    if (!r.foods.length) { MM.sfx.play('tap'); return; }
    MM.sfx.play('pass');
    MM.fx.burst(pt.x, pt.y, { emojis: ['📮', '✨', '⭐'], count: 14 });
    r.foods.forEach((f, i) => setTimeout(() => MM.fx.flyTo(pt, u.$('#foodPill'), f.emoji).then(() => MM.updateTop()), i * 200));
    MM.toast(`通信指導 おつかれさま！ えさ×${r.foods.length} ${r.foods.map((f) => f.emoji).join('')}`, { big: true, ms: 2800 });
  };
  A.pass = async (el) => {
    const s = G.findSubject(el.dataset.uid);
    if (!s) return;
    const ok = await MM.ui.confirm(`「${u.esc(s.name)}」の単位認定試験に合格しましたか？<br><span class="small muted">合格（60点以上）したら押してね。モンスターが しんかします。</span>`, '合格した！');
    if (!ok) return;
    const r = G.pass(s.uid);
    if (!r) return;
    MM.sfx.play('pass');
    MM.buzz([50, 30, 90]);
    MM.fx.confetti(80);
    MM.toast(`🎓 ${s.credits}単位 GET！ ごほうびの えさ×${r.foods.length}`, { big: true, ms: 2800 });
    MM.updateTop();
    MM.refresh();
    if (r.evolved) { await wait(800); await MM.flow.evolve(r.from, r.to); }
    else if (r.pending) MM.toast('たまごが かえったら しんかするよ', { ms: 3000 });
    else if (r.maxed) MM.toast('もう さいごの すがた！ 単位の ひかりで かがやいている', { ms: 3000 });
  };

  // ---------- ごはん ----------
  A.openFeed = () => {
    const m = G.active();
    if (!m) return;
    if (m.stage === 0) { const e = monEl(); if (e) MM.fx.mood(e, 'is-hatching', 500); MM.sfx.play('wobble'); MM.toast('たまごは まだ たべられないよ。授業をやって あたためよう'); return; }
    const fav = MM.foodDef(MM.art.species(m.species).favorite);
    const items = MM.FOODS.filter((f) => MM.state.food[f.id] > 0);
    const list = items.length
      ? `<div>${items.map((f) => `<div class="list-row"><span style="font-size:30px">${f.emoji}</span><span class="grow"><b>${f.name}</b>${fav && f.id === fav.id ? ' <span class="badge b-ok">だいこうぶつ</span>' : ''}<br><span class="small muted">×${MM.state.food[f.id]}　おなか +${f.hunger}　なかよし +${f.aff}</span></span><button class="btn btn-primary btn-sm" data-feed="${f.id}">あげる</button></div>`).join('')}</div>`
      : `<div class="empty"><b>えさが ありません</b>授業を1回やるごとに、えさが1こ もらえます。</div>`;
    const ov = MM.ui.open(`<h3>ごはんを あげる</h3><p class="small muted">${u.esc(m.name)}の だいこうぶつ：${fav ? fav.emoji + ' ' + fav.name : '？'}</p>${list}`, {});
    u.$$('[data-feed]', ov).forEach((b) => { b.onclick = () => { MM.ui.close(ov); feed(b.dataset.feed); }; });
  };
  A.openFoodBag = A.openFeed;
  async function feed(id) {
    const r = G.feed(id), mon = monEl();
    if (r.full) { MM.sfx.play('no'); say('おなか いっぱい！ また あとでね'); return; }
    if (!r.ok || !mon) return;
    MM.updateTop();
    await MM.fx.flyTo(u.$('#foodPill'), mon, r.f.emoji, 30);
    MM.fx.mood(mon, 'is-eating', 1100);
    MM.sfx.play('eat');
    MM.buzz(20);
    await wait(1050);
    MM.fx.hearts(mon, r.fav ? ['💗', '💖', '✨', '😋'] : undefined);
    MM.sfx.play('pet');
    say(r.fav ? 'だいこうぶつだ〜！ ありがとう！' : u.pick(['おいしい〜！', 'もぐもぐ… しあわせ', 'ごちそうさま！']));
    if (r.levelUp) { MM.sfx.play('level'); MM.toast(`なかよしレベルが ${r.levelUp} に あがった！`, { big: true }); }
    MM.refresh();
  }

  // ---------- おせわ・なでる ----------
  A.openCare = () => {
    const m = G.active();
    if (!m) return;
    if (m.stage === 0) { A.pet(); return; }
    const ov = MM.ui.open(`<h3>おせわ</h3><div class="care-row">
      <button class="care-btn" data-care="bath"><span class="ico">🛁</span>おふろ<small>ピカピカに</small></button>
      <button class="care-btn" data-care="play"><span class="ico">⚽</span>あそぶ<small>ジャンプ！</small></button>
      <button class="care-btn" data-care="brush"><span class="ico">🪮</span>ブラシ<small>ふわふわに</small></button></div>
      <p class="note" style="margin-top:10px">ごきげんが あがります。おなじ おせわは 45分ごとに なかよし度も あがります。</p>`, {});
    u.$$('[data-care]', ov).forEach((b) => { b.onclick = () => { MM.ui.close(ov); care(b.dataset.care); }; });
  };
  function care(kind) {
    const r = G.care(kind), mon = monEl();
    if (!r || !mon) return;
    const c = MM.fx.center(mon);
    if (kind === 'bath') { MM.fx.mood(mon, 'is-bath', 1600); MM.sfx.play('bath'); MM.fx.burst(c.x, c.y, { emojis: ['🫧', '🫧', '💧', '✨'], count: 18, dist: 90, up: 50 }); say('さっぱり〜！'); }
    if (kind === 'play') { MM.fx.mood(mon, 'is-play', 1900); MM.sfx.play('jump'); MM.fx.burst(c.x, c.y - 40, { emojis: ['⭐', '✨', '⚽'], count: 10 }); say('たのしい〜！ もっと あそぼ！'); }
    if (kind === 'brush') { MM.fx.mood(mon, 'is-happy', 1400); MM.sfx.play('pet'); MM.fx.burst(c.x, c.y, { emojis: ['✨', '💫'], count: 12 }); say('ふわふわに なったよ'); }
    MM.refresh();
  }
  A.pet = () => {
    const m = G.active(), mon = monEl();
    if (!m || !mon) return;
    if (m.stage === 0) {
      if ((m.warmth || 0) >= G.HATCH_AT) { MM.flow.hatch(); return; }
      MM.fx.mood(mon, 'is-hatching', 500); MM.sfx.play('wobble'); say(G.speech()); return;
    }
    G.pet();
    MM.fx.mood(mon, 'is-happy', 1400);
    MM.fx.hearts(mon);
    MM.sfx.play('pet');
    MM.buzz(15);
    say(u.pick(['えへへ', 'うれしい〜', 'もっと なでて〜', 'だいすき！']), 1800);
    MM.refresh();
  };
  A.teamInfo = (el) => {
    const m = MM.state.monsters.find((x) => x.id === el.dataset.id);
    if (!m) return;
    const nm = m.stage ? m.name : MM.art.formName(m.species, 0);
    const ov = MM.ui.open(`<h3>${u.esc(nm)}</h3>${MM.art.html(m, { size: 150, cls: 'is-happy' })}
      <p><b>${u.esc(MM.art.formName(m.species, m.stage))}</b>（${MM.art.stageLabel(m.stage)}）</p><p class="small">${u.esc(MM.art.desc(m.species, m.stage))}</p>
      <p class="small muted">${MM.sem.label(m.sem)}に そだてた なかま ・ ${m.credits || 0}単位 ・ なかよしLv.${G.level(m)}</p>
      <div class="modal-actions"><button class="btn" data-x="close">とじる</button></div>`, { center: true });
    MM.sfx.play('pet');
    ov.querySelector('[data-x="close"]').onclick = () => MM.ui.close(ov);
  };

  // ---------- 科目カードのメニュー ----------
  A.subjMenu = (el) => {
    const s = G.findSubject(el.dataset.uid);
    if (!s) return;
    const unit = s.type === 'face' || s.type === 'live' ? 'コマ' : '回';
    const ov = MM.ui.open(`<h3>${u.esc(s.name)}</h3><div class="stack">
      <button class="btn btn-block" data-m="undo" ${s.done <= 0 ? 'disabled' : ''}>1${unit} もどす（まちがえたとき）</button>
      ${s.passed ? '<button class="btn btn-block" data-m="unpass">単位GETを とりけす</button>' : '<button class="btn btn-block" data-m="pass">合格した（単位GET）</button>'}
      <div class="field"><label for="smTotal">単位までに必要な${unit}数</label><div class="row-wrap"><input class="input num" id="smTotal" type="number" min="1" max="30" value="${s.total}" style="max-width:110px"><button class="btn btn-sm" data-m="total">変える</button></div></div>
      <button class="btn btn-block btn-danger" data-m="del">この科目を 外す</button></div>`, {});
    const on = (k, fn) => { const b = ov.querySelector(`[data-m="${k}"]`); if (b) b.onclick = fn; };
    on('undo', () => { G.undoLesson(s.uid); MM.ui.close(ov); MM.refresh(); });
    on('pass', () => { MM.ui.close(ov); A.pass({ dataset: { uid: s.uid } }); });
    on('unpass', async () => { MM.ui.close(ov); if (await MM.ui.confirm('単位GETを とりけしますか？ モンスターの しんかも 1つ もどります。', 'とりけす', true)) { G.unpass(s.uid); MM.refresh({ habitat: true }); } });
    on('total', () => { const v = Math.max(1, Math.min(30, Number(u.$('#smTotal', ov).value) || s.total)); s.total = v; s.done = Math.min(s.done, v); MM.save(); MM.ui.close(ov); MM.refresh(); });
    on('del', async () => { MM.ui.close(ov); if (await MM.ui.confirm(`「${u.esc(s.name)}」を今学期の科目から外しますか？ これまでの記録も消えます。`, '外す', true)) { G.removeSubject(s.uid); MM.refresh(); } });
  };

  A.nextTip = () => { if (MM.tips) MM.tips.next(); MM.sfx.play('tap'); MM.refresh({ tip: true }); };
  A.toggleSound = () => { MM.state.profile.sound = !MM.state.profile.sound; MM.save(); MM.updateTop(); if (MM.state.profile.sound) MM.sfx.play('get'); };
  A.endDemo = async () => {
    if (!(await MM.ui.confirm('おためしデータを消して、自分のデータで始めますか？', '始める'))) return;
    MM.state = MM.defaultState();
    MM.save(true);
    MM.go('home');
    MM.flow.onboarding();
  };

  // ---------- おためしデータ（見本。自分のデータではありません） ----------
  MM.demo = {
    load() {
      MM.state = MM.defaultState();
      const st = MM.state;
      st.onboarded = true; st.demo = true;
      st.profile.course = 'shinri'; st.profile.earnedBefore = 30;
      const cur = MM.sem.current(), p1 = MM.sem.shift(cur, -1), p2 = MM.sem.shift(cur, -2), now = Date.now();
      st.monsters.push({ id: 'm_demo1', species: 'turtle', name: 'かめじろう', sem: p2, stage: 3, hunger: 80, mood: 80, aff: 24, credits: 8, tick: now, frozen: true });
      st.monsters.push({ id: 'm_demo2', species: 'bird', name: 'ぴよまる', sem: p1, stage: 4, hunger: 80, mood: 80, aff: 31, credits: 12, tick: now, frozen: true });
      st.monsters.push({ id: 'm_demo3', species: 'shark', name: 'さめぽん', sem: cur, stage: 2, warmth: 3, hunger: 52, mood: 68, aff: 12, credits: 2, tick: now, frozen: false });
      st.activeId = 'm_demo3';
      const all = MM.catalog.all;
      const firstOf = (fn) => all.find(fn);
      const picks = [
        firstOf((s) => /心理学概論/.test(s.name)) || firstOf((s) => (s.courses || []).includes('心理と教育')),
        firstOf((s) => /^基盤科目/.test(s.cat || '') && !/外国語/.test(s.cat || '')),
        firstOf((s) => /英語/.test(s.name) && /外国語/.test(s.cat || '')),
        firstOf((s) => s.home === '心理と教育' && /導入/.test(s.cat || '') && !/心理学概論/.test(s.name)),
      ].filter(Boolean);
      const prog = [{ done: 15, passed: true, tsushin: true }, { done: 9, tsushin: true }, { done: 4 }, { done: 1 }];
      picks.forEach((c, i) => { const s = G.register(c); if (s) Object.assign(s, prog[i] || {}); });
      const face = G.addCustom({ name: '（例）面接授業：くらしと心理学', type: 'face', credits: 1, total: 8, course: '心理と教育' });
      face.done = 2;
      const subs = G.subjects();
      if (subs[1]) { st.tt[1].push(subs[1].uid); st.tt[4].push(subs[1].uid); }
      if (subs[2]) st.tt[3].push(subs[2].uid);
      if (subs[3]) { st.tt[u.dow(u.today())].push(subs[3].uid); }
      const sat = u.addDays(u.today(), (6 - u.dow(u.today()) + 7) % 7 || 7);
      st.events.push({ id: 'e_demo1', kind: 'face', title: '（例）面接授業：くらしと心理学', date: sat, end: u.addDays(sat, 1), start: '10:00', place: '（例）○○学習センター', note: '' });
      st.food = { onigiri: 2, fish: 3, strawberry: 1, star: 1 };
      st.stats = { lessons: 31, foodEarned: 38, streak: 3, lastStudy: u.addDays(u.today(), -1) };
      MM.save(true);
      MM.go('home');
      MM.toast('おためしデータを 入れました（見本です）', { ms: 2600 });
    },
  };
})();

</script>
<script>
/* まなモン：ホーム（モンスター・単位・きょうの予定・今学期の科目） */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const V = (MM.views = MM.views || {});
  const SIZE = [124, 122, 142, 160, 176];
  const TEAM_POS = [13, 87, 27, 73, 5, 95];

  function stageDots(st) {
    return `<span class="stage-dots" aria-label="しんか ${st}/4">${[1, 2, 3, 4].map((i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</span>`;
  }
  function statsHtml(m) {
    if (!m) return '';
    if (m.stage === 0) return `<span class="stat">🥚 あたため ${Math.min(m.warmth || 0, G.HATCH_AT)} / ${G.HATCH_AT}</span>`;
    const v = G.vitals(m);
    return `<span class="stat"><span>おなか</span><span class="mini"><i style="width:${v.hunger.toFixed(0)}%"></i></span></span>`
      + `<span class="stat mood"><span>ごきげん</span><span class="mini"><i style="width:${v.mood.toFixed(0)}%"></i></span></span>`
      + `<span class="stat lv">Lv.${G.level(m)}</span>`;
  }
  function plateHtml(m) {
    if (!m) return '';
    const nm = m.stage === 0 ? MM.art.formName(m.species, 0) : m.name;
    return `${u.esc(nm)} <span class="muted small">${MM.art.stageLabel(m.stage)}</span>${stageDots(m.stage)}`;
  }
  function habitatInner() {
    const m = G.active();
    const team = G.team().slice(-6);
    const mates = team.map((t, i) => `<div class="team-mate" style="left:${TEAM_POS[i]}%;transform:translateX(-50%)" data-act="teamInfo" data-id="${t.id}" title="${u.esc(t.name)}">${MM.art.html(t, { size: 58 + t.stage * 5 })}</div>`).join('');
    const act = m
      ? `<div class="active-wrap" id="activeWrap">${MM.art.html(m, { size: SIZE[m.stage], cls: 'active-mon' })}</div>`
      : '';
    return `<div class="hab-stats" id="habStats">${statsHtml(m)}</div><div class="speech" id="speech"></div>`
      + `<div class="team-row">${mates}</div><div class="ground"></div>${act}`
      + (m ? `<div class="nameplate" id="plate">${plateHtml(m)}</div>` : '');
  }

  function creditsHtml() {
    const c = G.credits();
    const pct = Math.min(100, (c.total / c.required) * 100);
    return `<div class="sec-h"><h2>単位のきろく</h2><span class="sub">${MM.sem.label(MM.sem.current())}</span></div>
      <div class="credit-hero">
        <div class="credit-main">
          <span class="label">卒業まで あと</span>
          <div class="big-num num">${c.remain}<small>単位</small></div>
          <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
          <div class="req-line"><span>とった単位 ${c.total}</span><span>必要 ${c.required}</span></div>
        </div>
        <div class="credit-side">
          <div class="mini-tile sun"><div class="label">今学期 のこり</div><div class="val num">${c.semRemain}<small>単位</small></div></div>
          <div class="mini-tile"><div class="label">今学期 とった</div><div class="val num">${c.semEarned}<small>/ ${c.semReg}単位</small></div></div>
        </div>
      </div>`;
  }

  function todayHtml() {
    const d = u.today();
    const items = G.dayItems(d), evs = G.eventsOn(d), off = G.officialOn(d);
    const rows = items.map((p) => `<div class="today-item">
        <span class="dot" style="background:${p.subj.color}"></span>
        <span class="grow">${u.esc(p.subj.name)}${p.tt ? ' <span class="badge">時間割</span>' : ''}</span>
        <button class="check ${p.done ? 'on' : ''}" data-act="planDone" data-date="${d}" data-uid="${p.uid}" aria-label="やった">✓</button>
      </div>`).join('');
    const evRows = evs.map((e) => `<div class="today-item"><span>${e.kind === 'face' ? '🏫' : '📌'}</span><span class="grow">${u.esc(e.title)}<span class="muted small"> ${u.esc([e.start, e.place].filter(Boolean).join(' ・ '))}</span></span></div>`).join('');
    const offRows = off.map((e) => `<div class="official-band">📣 ${u.esc(e.title)}</div>`).join('');
    const body = rows || evRows || offRows
      ? `<div class="stack">${offRows}${evRows ? `<div>${evRows}</div>` : ''}${rows ? `<div>${rows}</div>` : ''}</div>`
      : `<div class="empty"><b>きょうの予定は まだありません</b>スケジュールで、きょう勉強する科目をワンタッチで入れられます。</div>`;
    return `<div class="sec-h"><h2>きょうの予定</h2><button class="btn btn-sm btn-ghost" data-nav="schedule">スケジュール ›</button></div>${body}`;
  }

  function subjCard(s) {
    const ticks = Array.from({ length: s.total }, (_, i) => `<i class="${i < s.done ? 'on' : ''}"></i>`).join('');
    const typeBadge = s.type === 'broadcast'
      ? `<span class="badge ${s.media === 'ラジオ' ? 'b-radio' : 'b-tv'}">${s.media === 'ラジオ' ? 'ラジオ' : s.media === 'テレビ' ? 'テレビ' : '放送'}</span>`
      : `<span class="badge ${s.type === 'face' ? 'b-face' : 'b-online'}">${MM.TYPE_LABEL[s.type] || 'その他'}</span>`;
    const unit = s.type === 'face' || s.type === 'live' ? 'コマ' : '回';
    let action;
    if (s.passed) action = `<span class="badge b-ok">🎓 単位GET！</span>`;
    else if (s.done >= s.total) action = `<button class="btn btn-sun btn-sm done-btn" data-act="pass" data-uid="${s.uid}">🎓 合格したら 単位GET</button>`;
    else action = `<button class="btn btn-primary btn-sm done-btn" data-act="lesson" data-uid="${s.uid}">＋1${unit} やった！</button>`;
    const tsushin = s.type === 'broadcast'
      ? `<button class="ms ${s.tsushin ? 'on' : ''}" data-act="tsushin" data-uid="${s.uid}">${s.tsushin ? '✔' : '□'} 通信指導</button>` : '';
    return `<article class="subj ${s.passed ? 'passed' : ''}" style="--c:${s.color}" data-uid="${s.uid}">
      <div class="subj-top">
        <div style="flex:1;min-width:0"><div class="subj-name">${u.esc(s.name)}</div>
          <div class="subj-meta">${typeBadge}<span class="badge">${s.credits}単位</span>${s.cat ? `<span class="badge">${u.esc(s.cat.replace(/（.*$/, ''))}</span>` : ''}${s.carried ? '<span class="badge">再試験・引きつぎ</span>' : ''}</div></div>
        <button class="more-btn" data-act="subjMenu" data-uid="${s.uid}" aria-label="メニュー">⋯</button>
      </div>
      <div class="ticks" style="--n:${s.total}" aria-label="${s.done} / ${s.total}${unit}">${ticks}</div>
      <div class="subj-bottom"><span class="subj-count"><b class="num">${s.done}</b> / ${s.total}${unit}</span>${tsushin}${action}</div>
    </article>`;
  }
  V.subjCard = subjCard;

  function subjectsHtml() {
    const list = G.subjects();
    const head = `<div class="sec-h"><h2>今学期の科目 <span class="sub">${list.length}科目</span></h2><button class="btn btn-sm" data-nav="subjects">＋ 科目をえらぶ</button></div>`;
    if (!list.length) return head + `<div class="empty"><b>まだ科目が ありません</b>「科目」タブで今学期の科目を登録すると、ここで1回ずつ進みぐあいを記録できます。1回やるごとに えさ がもらえます。</div>`;
    return head + `<div class="stack">${list.map(subjCard).join('')}</div>`;
  }

  function tipHtml() {
    const t = MM.tips ? MM.tips.today() : null;
    if (!t) return '';
    return `<div class="tip-card feature"><div class="tip-cat">きょうのまめちしき ・ ${u.esc(t.cat)}</div>
      <div class="tip-title">${u.esc(t.title)}</div><p class="tip-body">${u.esc(t.body)}</p>
      <div class="row-wrap" style="margin-top:10px"><button class="btn btn-sm" data-act="nextTip">つぎの豆知識</button><button class="btn btn-sm btn-ghost" data-nav="tips">ぜんぶ見る ›</button></div></div>`;
  }

  // ---------- 飼育ケースの動き ----------
  let walkTimer = null, talkTimer = null, x = 0;
  function say(text, ms) {
    const b = u.$('#speech');
    if (!b || !text) return;
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(b._t);
    b._t = setTimeout(() => b.classList.remove('show'), ms || 3200);
  }
  V.say = say;
  function startHabitat() {
    stopHabitat();
    u.$$('.team-mate .mon-bob').forEach((el) => { el.style.animationDelay = (-Math.random() * 2.5).toFixed(2) + 's'; });
    walkTimer = setInterval(() => {
      const w = u.$('#activeWrap'), hab = u.$('#habitat');
      const m = G.active();
      if (!w || !hab || !m || m.stage === 0) return;
      const max = Math.max(20, hab.clientWidth / 2 - 90);
      const nx = Math.round((Math.random() * 2 - 1) * max);
      const mon = w.querySelector('.mon');
      if (mon) mon.classList.toggle('face-left', nx < x);
      x = nx;
      w.style.transform = `translateX(${x}px)`;
    }, 4200);
    talkTimer = setInterval(() => { if (Math.random() < 0.6) say(G.speech()); }, 9000);
    setTimeout(() => say(G.speech()), 900);
  }
  function stopHabitat() { clearInterval(walkTimer); clearInterval(talkTimer); x = 0; }

  V.home = {
    render() {
      const demo = MM.state.demo
        ? `<div class="demo-banner"><span>いまは <b>おためしデータ</b> です。</span><button class="btn btn-sm" data-act="endDemo">自分のデータで始める</button></div>` : '';
      return `${demo}
        <section class="habitat" id="habitat">${habitatInner()}</section>
        <div class="care-row">
          <button class="care-btn" data-act="openFeed"><span class="ico">🍙</span>ごはん<small id="careFood">えさ ${MM.foodTotal()}こ</small></button>
          <button class="care-btn" data-act="openCare"><span class="ico">🫧</span>おせわ<small>おふろ・あそぶ</small></button>
          <button class="care-btn" data-act="pet"><span class="ico">🤚</span>なでる<small>モンスターをタップでも</small></button>
        </div>
        <section class="card" id="creditCard">${creditsHtml()}</section>
        <section class="card" id="todayCard">${todayHtml()}</section>
        <section class="card" id="subjCard">${subjectsHtml()}</section>
        <section id="tipCard">${tipHtml()}</section>`;
    },
    mount: startHabitat,
    unmount: stopHabitat,
    tick() { const el = u.$('#habStats'); if (el) el.innerHTML = statsHtml(G.active()); },
    refresh(opt) {
      const set = (id, html) => { const el = u.$('#' + id); if (el) el.innerHTML = html; };
      set('creditCard', creditsHtml());
      set('todayCard', todayHtml());
      set('subjCard', subjectsHtml());
      const cf = u.$('#careFood'); if (cf) cf.textContent = `えさ ${MM.foodTotal()}こ`;
      if (opt && opt.habitat) { set('habitat', habitatInner()); startHabitat(); }
      else { set('habStats', statsHtml(G.active())); set('plate', plateHtml(G.active())); }
      if (opt && opt.tip) set('tipCard', tipHtml());
    },
  };
})();

</script>
<script>
/* まなモン：スケジュール（カレンダー・時間割・面接授業・公式の日程） */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const V = (MM.views = MM.views || {});
  const A = (MM.act = MM.act || {});
  const st = { month: u.today().slice(0, 7), sel: u.today(), tab: 'cal', filter: 'all' };

  const matchFilter = (s, f) => f === 'all' || (f === 'common' ? /基盤|共通/.test(s.cat || s.course || '') : s.course === f);
  function filterChips(cur, act, extra) {
    const opts = [['all', 'すべて'], ['common', '共通（基盤）']].concat(MM.COURSES.map((c) => [c.name, c.name]));
    return `<div class="chips-scroll">${opts.map(([v, l]) => `<button class="chip ${cur === v ? 'on' : ''}" data-act="${act}" data-f="${v}"${extra || ''}>${l}</button>`).join('')}</div>`;
  }
  V.filterChips = filterChips;

  function calHtml() {
    const [y, m] = st.month.split('-').map(Number);
    const first = `${y}-${u.pad(m)}-01`, startDow = u.dow(first), days = new Date(y, m, 0).getDate();
    const start = u.addDays(first, -startDow), total = Math.ceil((startDow + days) / 7) * 7, today = u.today();
    let cells = '';
    for (let i = 0; i < total; i++) {
      const d = u.addDays(start, i), dw = i % 7;
      const items = G.dayItems(d), evs = G.eventsOn(d), off = G.officialOn(d);
      const bars = items.slice(0, 3).map((p) => `<i class="${p.done ? 'done' : ''}" style="--c:${p.subj.color}"></i>`).join('');
      const icons = (evs.some((e) => e.kind === 'face') ? '🏫' : '') + (evs.some((e) => e.kind !== 'face') ? '📌' : '') + (off.length ? '📣' : '') + (items.length > 3 ? `+${items.length - 3}` : '');
      const cls = ['cal-cell', d.slice(0, 7) === st.month ? '' : 'out', d === today ? 'today' : '', d === st.sel ? 'sel' : '', off.length ? 'official' : '', dw === 0 ? 'sun' : dw === 6 ? 'sat' : ''].join(' ');
      cells += `<button class="${cls}" data-act="calPick" data-date="${d}" aria-label="${u.jp(d)}"><span class="d">${Number(d.slice(8))}</span><span class="cal-bars">${bars}</span><span class="cal-icons">${icons}</span></button>`;
    }
    return `<section class="card">
      <div class="cal-head"><button class="icon-btn" data-act="calMonth" data-k="-1" aria-label="前の月">‹</button><h2>${y}年${m}月</h2><button class="icon-btn" data-act="calMonth" data-k="1" aria-label="次の月">›</button></div>
      <div class="cal-grid">${u.DOW.map((w, i) => `<div class="cal-dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}${cells}</div>
      <div class="row-wrap" style="justify-content:space-between;align-items:center;margin-top:8px"><p class="note" style="margin:0">色の線＝勉強する科目　🏫＝面接授業　📣＝放送大学の日程</p><button class="btn btn-sm" data-act="calToday">きょう</button></div>
    </section>`;
  }

  function dayHtml() {
    const d = st.sel, items = G.dayItems(d), evs = G.eventsOn(d), off = G.officialOn(d), canCheck = d <= u.today();
    const list = items.map((p) => `<div class="today-item"><span class="dot" style="background:${p.subj.color}"></span>
        <span class="grow">${u.esc(p.subj.name)}${p.tt ? ' <span class="badge">時間割</span>' : ''}</span>
        ${canCheck ? `<button class="check ${p.done ? 'on' : ''}" data-act="planDone" data-date="${d}" data-uid="${p.uid}" aria-label="やった">✓</button>` : ''}
        <button class="more-btn" data-act="planRemove" data-date="${d}" data-uid="${p.uid}" aria-label="この日から外す">×</button></div>`).join('');
    const evRows = evs.map((e) => {
      const when = [e.date !== (e.end || e.date) ? `${u.md(e.date)}〜${u.md(e.end)}` : '', e.start, e.place].filter(Boolean).join(' ・ ');
      return `<div class="event-row"><span class="ico">${e.kind === 'face' ? '🏫' : '📌'}</span><span class="grow"><b>${u.esc(e.title)}</b>${u.esc(when)}${e.note ? `<br><span class="small muted">${u.esc(e.note)}</span>` : ''}</span><button class="more-btn" data-act="eventRemove" data-id="${e.id}" aria-label="消す">×</button></div>`;
    }).join('');
    const offRows = off.map((e) => `<div class="official-band">📣 ${u.esc(e.title)}${e.note ? `<br><span style="font-weight:500">${u.esc(e.note)}</span>` : ''}</div>`).join('');
    const subs = G.subjects().filter((s) => !s.passed);
    const chips = subs.filter((s) => matchFilter(s, st.filter)).map((s) => {
      const on = items.some((p) => p.uid === s.uid);
      return `<button class="chip ${on ? 'on' : ''}" data-act="planToggle" data-date="${d}" data-uid="${s.uid}"><span class="dot" style="background:${s.color}"></span><span class="chip-label">${u.esc(s.name)}</span></button>`;
    }).join('');
    const empty = !offRows && !evRows && !list ? '<div class="empty"><b>予定なし</b>下の科目をタップすると、この日にやる科目を入れられます。</div>' : '';
    return `<section class="card day-panel">
      <div class="sec-h"><h3>${u.jp(d)}</h3>${d === u.today() ? '<span class="badge b-ok">きょう</span>' : ''}</div>
      <div class="stack">${offRows}${evRows ? `<div>${evRows}</div>` : ''}${list ? `<div>${list}</div>` : ''}${empty}</div>
      <div style="margin-top:16px">
        <div class="sec-h" style="margin-bottom:6px"><h2 style="font-size:15px">ワンタッチで追加</h2><span class="sub">タップで入れる・外す</span></div>
        ${filterChips(st.filter, 'schFilter')}
        <div style="margin-top:8px">${subs.length ? `<div class="row-wrap">${chips || '<span class="small muted">この絞り込みの科目はありません</span>'}</div>` : `<div class="empty"><b>今学期の科目が まだありません</b>「科目」タブで登録するか、下の「科目をさがして入れる」から選べます。</div>`}</div>
      </div>
      <div class="row-wrap" style="margin-top:14px">
        <button class="btn btn-sm" data-act="addFace" data-date="${d}">🏫 面接授業を入れる</button>
        <button class="btn btn-sm" data-act="addMemo" data-date="${d}">📌 予定・メモ</button>
        <button class="btn btn-sm" data-act="pickCatalog" data-date="${d}">🔍 科目をさがして入れる</button>
      </div>
    </section>`;
  }

  function officialList() {
    const evs = (MM.DATA.events || []).filter((e) => (e.end || e.start) >= u.today());
    if (!evs.length) return '<div class="empty">これからの日程は 登録されていません。</div>';
    return evs.map((e) => `<div class="event-row"><span class="ico">📣</span><span class="grow"><b>${u.esc(e.title)}</b>${u.md(e.start)}${e.end && e.end !== e.start ? '〜' + u.md(e.end) : ''}${e.note ? `<br><span class="small muted">${u.esc(e.note)}</span>` : ''}</span></div>`).join('')
      + `<p class="note" style="margin-top:6px">日程は放送大学の公式サイトで${u.esc(MM.DATA.checked || '')}に確認したものです。変わることがあるので、システムWAKABAや公式サイトで確かめてください。</p>`;
  }

  function ttHtml() {
    const subs = G.subjects().filter((s) => !s.passed);
    const rows = [1, 2, 3, 4, 5, 6, 0].map((dw) => {
      const list = (MM.state.tt[dw] || []).map((id) => subs.find((s) => s.uid === id)).filter(Boolean);
      return `<div class="tt-row"><span class="tt-dow">${u.DOW[dw]}</span>
        <div class="chips">${list.map((s) => `<span class="chip"><span class="dot" style="background:${s.color}"></span><span class="chip-label">${u.esc(s.name)}</span></span>`).join('') || '<span class="small muted">なし</span>'}</div>
        <button class="btn btn-sm" data-act="ttEdit" data-dow="${dw}">えらぶ</button></div>`;
    }).join('');
    return `<section class="card"><div class="sec-h"><h2>いつもの時間割</h2><span class="sub">${MM.sem.label(MM.sem.current())}</span></div>
      <p class="lead">曜日ごとに いつも勉強する科目を決めておくと、カレンダーに毎週 自動で入ります。</p>${rows}</section>
      <section class="card"><div class="sec-h"><h2>放送大学の日程</h2></div>${officialList()}</section>`;
  }

  V.schedule = {
    render() {
      return `<h1 class="page-title">スケジュール</h1>
        <div class="seg"><button class="${st.tab === 'cal' ? 'on' : ''}" data-act="schTab" data-tab="cal">カレンダー</button><button class="${st.tab === 'tt' ? 'on' : ''}" data-act="schTab" data-tab="tt">時間割・日程</button></div>
        ${st.tab === 'cal' ? calHtml() + dayHtml() : ttHtml()}`;
    },
    refresh() { const v = u.$('#view'); if (v) v.innerHTML = V.schedule.render(); },
  };

  const re = () => MM.refresh();
  A.schTab = (el) => { st.tab = el.dataset.tab; re(); };
  A.schFilter = (el) => { st.filter = el.dataset.f; re(); };
  A.calMonth = (el) => { const [y, m] = st.month.split('-').map(Number); const d = new Date(y, m - 1 + Number(el.dataset.k), 1); st.month = u.ds(d).slice(0, 7); re(); };
  A.calToday = () => { st.sel = u.today(); st.month = st.sel.slice(0, 7); re(); };
  A.calPick = (el) => { st.sel = el.dataset.date; if (st.sel.slice(0, 7) !== st.month) st.month = st.sel.slice(0, 7); MM.sfx.play('tap'); re(); };
  A.planToggle = (el) => {
    const { date, uid } = el.dataset;
    if (G.dayItems(date).some((p) => p.uid === uid)) G.removePlan(date, uid); else G.addPlan(date, uid);
    MM.sfx.play('tap');
    re();
  };
  A.planRemove = (el) => { G.removePlan(el.dataset.date, el.dataset.uid); re(); };
  A.eventRemove = async (el) => { if (await MM.ui.confirm('この予定を消しますか？', '消す', true)) { G.removeEvent(el.dataset.id); re(); } };

  A.ttEdit = (el) => {
    const dw = Number(el.dataset.dow);
    const subs = G.subjects().filter((s) => !s.passed);
    const draw = () => subs.map((s) => `<button class="chip ${(MM.state.tt[dw] || []).includes(s.uid) ? 'on' : ''}" data-tt="${s.uid}"><span class="dot" style="background:${s.color}"></span><span class="chip-label">${u.esc(s.name)}</span></button>`).join('');
    const ov = MM.ui.open(`<h3>${u.DOW[dw]}曜日に やる科目</h3><div class="row-wrap" id="ttChips">${subs.length ? draw() : '<div class="empty" style="width:100%">今学期の科目を先に登録してください。</div>'}</div><div class="modal-actions"><button class="btn btn-primary" data-x="ok">できた</button></div>`, { onClose: re });
    ov.addEventListener('click', (e) => {
      const b = e.target.closest('[data-tt]');
      if (!b) return;
      G.toggleTT(dw, b.dataset.tt);
      MM.sfx.play('tap');
      u.$('#ttChips', ov).innerHTML = draw();
    });
    ov.querySelector('[data-x="ok"]').onclick = () => MM.ui.close(ov);
  };

  A.addFace = (el) => {
    const d = el.dataset.date;
    const faces = G.subjects().filter((s) => s.type === 'face');
    const ov = MM.ui.open(`<h3>🏫 面接授業を入れる</h3><div class="stack">
      <div class="field"><label for="fTitle">科目名</label><input class="input" id="fTitle" list="fList" placeholder="例：くらしと心理学" autofocus><datalist id="fList">${faces.map((s) => `<option value="${u.esc(s.name)}">`).join('')}</datalist></div>
      <div class="grid-2"><div class="field"><label for="fDate">1日目</label><input class="input" id="fDate" type="date" value="${d}"></div><div class="field"><label for="fEnd">さいごの日</label><input class="input" id="fEnd" type="date" value="${u.addDays(d, 1)}"></div></div>
      <div class="grid-2"><div class="field"><label for="fTime">はじまる時間</label><input class="input" id="fTime" type="time" value="10:00"></div><div class="field"><label for="fPlace">場所</label><input class="input" id="fPlace" placeholder="例：○○学習センター"></div></div>
      <div class="field"><label for="fNote">メモ</label><input class="input" id="fNote" placeholder="持ち物など"></div>
      <label class="list-row" style="padding:4px 0"><input type="checkbox" id="fReg" checked> <span class="grow small">今学期の科目にも登録する（1単位・8コマ）</span></label>
      <p class="note">面接授業は1科目1単位、90分×7回＋45分×1回（全8回）が基本です。</p>
      </div><div class="modal-actions"><button class="btn btn-primary" data-x="ok">入れる</button></div>`, {});
    ov.querySelector('[data-x="ok"]').onclick = () => {
      const title = u.$('#fTitle', ov).value.trim();
      if (!title) { u.$('#fTitle', ov).focus(); MM.toast('科目名を入れてください'); return; }
      const date = u.$('#fDate', ov).value || d;
      let end = u.$('#fEnd', ov).value || date;
      if (end < date) end = date;
      G.addEvent({ kind: 'face', title, date, end, start: u.$('#fTime', ov).value, place: u.$('#fPlace', ov).value.trim(), note: u.$('#fNote', ov).value.trim() });
      if (u.$('#fReg', ov).checked && !G.subjects().some((s) => s.name === title)) G.addCustom({ name: title, type: 'face', credits: 1, total: 8 });
      MM.ui.close(ov);
      MM.sfx.play('get');
      MM.toast('面接授業を入れました');
      re();
    };
  };
  A.addMemo = (el) => {
    const d = el.dataset.date;
    const ov = MM.ui.open(`<h3>📌 予定・メモ</h3><div class="stack">
      <div class="field"><label for="mTitle">なにをする？</label><input class="input" id="mTitle" placeholder="例：通信指導を出す" autofocus></div>
      <div class="grid-2"><div class="field"><label for="mDate">日にち</label><input class="input" id="mDate" type="date" value="${d}"></div><div class="field"><label for="mTime">時間</label><input class="input" id="mTime" type="time"></div></div>
      <div class="field"><label for="mNote">メモ</label><input class="input" id="mNote"></div></div>
      <div class="modal-actions"><button class="btn btn-primary" data-x="ok">入れる</button></div>`, {});
    ov.querySelector('[data-x="ok"]').onclick = () => {
      const title = u.$('#mTitle', ov).value.trim();
      if (!title) { u.$('#mTitle', ov).focus(); return; }
      const date = u.$('#mDate', ov).value || d;
      G.addEvent({ kind: 'memo', title, date, end: date, start: u.$('#mTime', ov).value, place: '', note: u.$('#mNote', ov).value.trim() });
      MM.ui.close(ov);
      MM.sfx.play('tap');
      re();
    };
  };
  A.pickCatalog = (el) => {
    const d = el.dataset.date;
    const ps = { f: MM.state.profile.course !== 'undecided' ? MM.courseName(MM.state.profile.course) : 'all', q: '' };
    const draw = () => {
      const q = ps.q.trim();
      const list = MM.catalog.all.filter((s) => (ps.f === 'all' || (ps.f === 'common' ? MM.catalog.isCommon(s) : (s.courses || []).includes(ps.f))) && (!q || s.name.includes(q))).slice(0, 80);
      return list.map((s) => `<div class="list-row"><span class="grow"><b style="font-size:14px">${u.esc(s.name)}</b><br><span class="small muted">${u.esc(s.cat || '')} ・ ${s.credits}単位</span></span><button class="btn btn-sm ${G.isRegistered(s.id) ? '' : 'btn-primary'}" data-pick="${s.id}">${G.isRegistered(s.id) ? 'この日に入れる' : '登録して入れる'}</button></div>`).join('') || '<div class="empty">見つかりませんでした</div>';
    };
    const ov = MM.ui.open(`<h3>科目をさがして ${u.md(d)} に入れる</h3>
      <input class="input" id="pcQ" placeholder="科目名でさがす" style="margin-bottom:8px">
      <div id="pcF">${filterChips(ps.f, 'x')}</div><div id="pcList" style="margin-top:6px">${draw()}</div>`, { onClose: re });
    u.$('#pcQ', ov).addEventListener('input', (e) => { ps.q = e.target.value; u.$('#pcList', ov).innerHTML = draw(); });
    ov.addEventListener('click', (e) => {
      const f = e.target.closest('#pcF [data-f]');
      if (f) { e.stopPropagation(); ps.f = f.dataset.f; u.$('#pcF', ov).innerHTML = filterChips(ps.f, 'x'); u.$('#pcList', ov).innerHTML = draw(); return; }
      const b = e.target.closest('[data-pick]');
      if (!b) return;
      const c = MM.catalog.byId(b.dataset.pick);
      let s = G.subjects().find((x) => x.catId === c.id);
      if (!s) s = G.register(c);
      G.addPlan(d, s.uid);
      MM.sfx.play('get');
      MM.toast(`「${u.esc(c.name)}」を ${u.md(d)} に入れました`);
      MM.ui.close(ov);
    }, true);
  };
})();

</script>
<script>
/* まなモン：科目の詳細（マイ科目・共通科目・コース科目・卒業要件） */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const V = (MM.views = MM.views || {});
  const A = (MM.act = MM.act || {});
  const ss = { tab: 'my', course: null, q: '', open: new Set() };

  // ---------- 難易度・おすすめ度・活かせる仕事（科目名と区分から出す目安） ----------
  const JOBS = [
    [/心理|カウンセ|臨床|発達|認知|人格/, ['人事・採用', '教育・保育', '福祉・相談', 'カウンセリング補助']],
    [/教育|学校|学習|保育|子ども|生涯/, ['教育・保育', '研修講師', '社会教育・生涯学習']],
    [/福祉|介護|障害|ケア|高齢|社会保障/, ['介護・福祉', '相談支援', '医療・福祉の事務']],
    [/看護|医療|病|健康|保健|食|栄養|運動|身体|睡眠/, ['医療・看護', '健康づくり', '食・栄養']],
    [/家族|生活|住|衣|消費|暮らし|くらし/, ['生活関連サービス', '住まい・インテリア', '消費生活相談']],
    [/法|行政|政治|憲法|自治|公共/, ['法務・総務', '公務員', '行政書士などの資格']],
    [/経済|財政|金融|市場|貨幣/, ['金融・保険', '経理・財務', '企画・調査']],
    [/経営|会計|簿記|マーケ|企業|組織|ビジネス|産業|起業|労働/, ['営業・企画', '経理・会計', '人事・労務']],
    [/社会|地域|都市|メディア|ジャーナリズム|国際|グローバル/, ['企画・広報', '地域づくり', 'マスコミ・広告']],
    [/環境|農|資源|エネルギー|持続/, ['環境・エネルギー', '農業・食品']],
    [/デザイン|工学|技術|ものづくり|建築/, ['ものづくり・技術', 'デザイン']],
    [/英語|ドイツ語|フランス語|中国語|韓国語|スペイン語|ロシア語|アラビア語|外国語|言語/, ['通訳・翻訳', '観光・接客', '国際業務']],
    [/日本語/, ['日本語教師', '事務全般', '文章を書く仕事']],
    [/歴史|日本史|世界史|西洋史|東洋史|考古|史料|古代|中世|近世|近代/, ['学芸員', '観光ガイド', '出版・編集']],
    [/博物館|美術|芸術|音楽|文化財|美学/, ['学芸員', '美術館・文化施設']],
    [/文学|物語|詩|小説|古典|源氏|万葉|和歌/, ['出版・編集', 'ライター', '教育']],
    [/哲学|思想|倫理|宗教/, ['教育', '企画・研究', '対人サービス']],
    [/人類学|民俗|文化/, ['観光・国際交流', '地域文化の仕事']],
    [/統計|数学|データ|情報|コンピュータ|プログラ|AI|デジタル/, ['データ分析', '事務のIT化', 'IT関連']],
  ];
  MM.subjectMeta = function (s) {
    const name = s.name || '', cat = s.cat || '';
    const jobs = [];
    JOBS.forEach(([re, js]) => { if (re.test(name) || (s.summary && re.test(s.summary) && jobs.length < 2)) js.forEach((j) => { if (!jobs.includes(j)) jobs.push(j); }); });
    let diff = /基盤|導入/.test(cat) ? 2 : 3;
    if (/統計|数学|法学|経済学|会計|簿記|プログラ|上級|中級|文法|古文|漢文|史料|論理|微分|理論/.test(name)) diff += 1;
    if (/入門|はじめて|初歩|基礎|いざない|とびら|事始め|ベーシック|やさしい/.test(name)) diff -= 1;
    let rec = 3, recNote = '';
    if (/基盤|導入/.test(cat)) { rec += 1; recNote = '最初のころに取りやすい'; }
    const own = MM.state.profile.course !== 'undecided' ? MM.courseName(MM.state.profile.course) : '';
    if (own && (s.courses || []).includes(own)) { rec += 1; recNote = '所属コースの科目'; }
    if (/外国語/.test(cat) && /初歩|入門|事始め|ベーシック/.test(name)) { rec += 1; recNote = '外国語2単位の要件に'; }
    if (s.closing) { rec -= 1; recNote = '閉講予定（早めに）'; }
    return { diff: u.clamp(diff, 1, 5), rec: u.clamp(rec, 1, 5), recNote, jobs: jobs.slice(0, 4).length ? jobs.slice(0, 4) : ['教養として いろいろな仕事に'] };
  };

  const chev = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const mediaBadge = (s) => (s.media === 'ラジオ' ? '<span class="badge b-radio">ラジオ</span>' : s.media === 'テレビ' ? '<span class="badge b-tv">テレビ</span>' : '');

  function item(s, ctx) {
    const reg = G.isRegistered(s.id), open = ss.open.has(s.id), meta = MM.subjectMeta(s);
    const shared = ctx && (s.home ? s.home !== ctx : (s.courses || []).length > 1);
    const terms = (s.terms || []).length ? s.terms.map((t) => `第${t}学期`).join('・') : '—';
    return `<div class="acc ${open ? 'open' : ''}" data-acc="${s.id}">
      <button class="acc-h" data-act="accToggle" data-id="${s.id}" aria-expanded="${open}">
        <span class="reg-mark ${reg ? 'on' : ''}" aria-label="${reg ? '登録ずみ' : '未登録'}">${reg ? '✓' : ''}</span>
        <span class="grow"><span class="t">${u.esc(s.name)}</span><span class="subj-meta">${mediaBadge(s)}<span class="badge">${s.credits}単位</span>${shared ? `<span class="badge">共用${s.home ? '・' + u.esc(s.home) : ''}</span>` : ''}${s.closing ? '<span class="badge">閉講予定</span>' : ''}</span></span>${chev}
      </button>
      <div class="acc-b">
        <dl class="kv">
          <dt>内容</dt><dd>${u.esc(s.summary || 'くわしくは公式のシラバスで確認してください。')}</dd>
          <dt>難易度</dt><dd>${u.stars(meta.diff)}</dd>
          <dt>おすすめ度</dt><dd>${u.stars(meta.rec)} <span class="small muted">${u.esc(meta.recNote)}</span></dd>
          <dt>活かせる仕事</dt><dd><div class="job-tags">${meta.jobs.map((j) => `<span>${u.esc(j)}</span>`).join('')}</div></dd>
          <dt>区分</dt><dd>${u.esc(s.cat || '')}${(s.courses || []).length && !MM.catalog.isCommon(s) ? `<br><span class="small muted">${u.esc(s.courses.join('・'))}コースで登録できる</span>` : ''}</dd>
          <dt>主任講師</dt><dd>${u.esc(s.teacher || '—')}</dd>
          <dt>開講</dt><dd>${terms}${s.closing ? `<br><span class="small muted">${u.esc(s.closing)}</span>` : ''}</dd>
          ${s.note ? `<dt>メモ</dt><dd>${u.esc(s.note)}</dd>` : ''}
        </dl>
        <div class="row-wrap">${reg ? `<button class="btn btn-sm" data-act="unregister" data-id="${s.id}">登録をやめる</button>` : `<button class="btn btn-primary btn-sm" data-act="registerSubj" data-id="${s.id}">今学期に登録</button>`}${s.url ? `<a class="btn btn-sm btn-ghost" href="${u.esc(s.url)}" target="_blank" rel="noopener">シラバス（公式）↗</a>` : ''}</div>
        <p class="note" style="margin-top:8px">難易度・おすすめ度・活かせる仕事は、このアプリが科目名と区分から出した目安です。内容は公式の授業科目案内を短くまとめたものです。</p>
      </div></div>`;
  }

  function grouped(list, ctx) {
    const order = [];
    const map = {};
    list.forEach((s) => { const k = s.cat || 'その他'; if (!map[k]) { map[k] = []; order.push(k); } map[k].push(s); });
    return order.map((k) => `<div class="group-h"><span>${u.esc(k)}</span><span>${map[k].length}科目</span></div>${map[k].map((s) => item(s, ctx)).join('')}`).join('');
  }
  const qMatch = (s) => !ss.q || s.name.includes(ss.q) || (s.summary || '').includes(ss.q);

  function commonHtml() {
    const list = MM.catalog.all.filter((s) => MM.catalog.isCommon(s) && qMatch(s));
    return `<section class="card"><div class="sec-h"><h2>共通科目（基盤科目）</h2><span class="sub">${list.length}科目</span></div>
      <p class="lead">どのコースの人も取れる科目です。卒業には基盤科目14単位以上（うち外国語2単位以上）が必要です。いまの制度では「共通科目」は「基盤科目」という名前になっています。</p>
      ${list.length ? grouped(list) : '<div class="empty">見つかりませんでした</div>'}</section>`;
  }
  function courseHtml() {
    const own = MM.state.profile.course !== 'undecided' ? MM.courseName(MM.state.profile.course) : null;
    const cur = ss.course || own || MM.COURSES[0].name;
    const chips = `<div class="chips-scroll">${MM.COURSES.map((c) => `<button class="chip ${cur === c.name ? 'on' : ''}" data-act="subjCourse" data-c="${c.name}">${c.name}${own === c.name ? ' ★' : ''}</button>`).join('')}</div>`;
    const list = MM.catalog.all.filter((s) => (s.courses || []).includes(cur) && qMatch(s));
    return `<section class="card"><div class="sec-h"><h2>コース科目</h2><span class="sub">${list.length}科目</span></div>
      ${chips}
      <p class="note" style="margin:8px 0 0">★＝所属コース。「共用」はほかのコースが開いている科目で、このコースでも自コースの科目として数えられます。区分は 導入 → 専門 → 総合 の順に進むのが目安です。</p>
      ${list.length ? grouped(list, cur) : '<div class="empty" style="margin-top:10px">見つかりませんでした</div>'}</section>`;
  }

  function myHtml() {
    const cur = G.subjects();
    const rows = cur.map((s) => `<div class="list-row"><span class="dot" style="width:12px;height:12px;border-radius:50%;background:${s.color};flex:none"></span><span class="grow"><b style="font-size:14px">${u.esc(s.name)}</b><br><span class="small muted">${MM.TYPE_LABEL[s.type] || ''} ・ ${s.credits}単位 ・ ${s.done}/${s.total}${s.passed ? ' ・ 🎓単位GET' : ''}</span></span><button class="more-btn" data-act="subjMenu" data-uid="${s.uid}" aria-label="メニュー">⋯</button></div>`).join('');
    const past = Object.entries(MM.state.semesters).filter(([id]) => id !== MM.sem.current()).sort((a, b) => MM.sem.cmp(b[0], a[0]));
    const pastHtml = past.map(([id, sd]) => `<div class="group-h"><span>${MM.sem.label(id)}</span><span>${sd.subjects.filter((s) => s.passed).reduce((a, s) => a + s.credits, 0)}単位</span></div>${sd.subjects.map((s) => `<div class="list-row"><span class="grow small">${u.esc(s.name)}</span><span class="badge ${s.passed ? 'b-ok' : ''}">${s.passed ? '単位GET' : 'のこり'}</span></div>`).join('')}`).join('');
    return `<section class="card"><div class="sec-h"><h2>今学期の科目</h2><span class="sub">${MM.sem.label(MM.sem.current())}</span></div>
      ${rows || '<div class="empty"><b>まだ登録していません</b>「共通科目」「コース科目」から えらぶか、下のボタンで自分で追加できます。</div>'}
      <div class="row-wrap" style="margin-top:12px"><button class="btn btn-sm" data-act="addCustomSubj">＋ 自分で科目を追加（面接授業・オンライン授業など）</button></div></section>
      ${pastHtml ? `<section class="card"><div class="sec-h"><h2>これまでの学期</h2></div>${pastHtml}</section>` : ''}`;
  }

  function reqHtml() {
    const R = MM.DATA.requirements;
    if (!R) return '<section class="card"><div class="empty">卒業要件のデータがありません</div></section>';
    const passed = G.passedAll();
    const own = MM.state.profile.course !== 'undecided' ? MM.courseName(MM.state.profile.course) : null;
    const isCourse = (s) => /導入|専門|総合/.test(s.cat || '');
    const inOwn = (s) => own && ((s.courses || []).includes(own) || s.course === own);
    const sum = (fn) => passed.filter(fn).reduce((a, s) => a + s.credits, 0);
    const val = {
      kiban: sum((s) => /^基盤/.test(s.cat || '')), foreign: sum((s) => /外国語/.test(s.cat || '')),
      course: sum(isCourse), own: own ? sum((s) => isCourse(s) && inOwn(s)) : null, other: own ? sum((s) => isCourse(s) && !inOwn(s)) : null,
      broadcast: sum((s) => s.type === 'broadcast'), faceOnline: sum((s) => ['face', 'online', 'live'].includes(s.type)),
    };
    const line = (r) => {
      const known = Object.prototype.hasOwnProperty.call(val, r.key);
      const v = known ? val[r.key] : undefined;
      const pct = v == null ? 0 : Math.min(100, (v / r.min) * 100);
      const text = !known ? `${r.min}単位` : v === null ? 'コースを決めると表示' : `${v} / ${r.min}単位以上`;
      return `<div class="req-item"><div class="req-top"><span>${u.esc(r.label)}</span><span class="num">${text}</span></div>
        ${known && v != null ? `<div class="bar ${pct >= 100 ? '' : 'sun'}"><i style="width:${pct.toFixed(1)}%"></i></div>` : ''}${r.note ? `<div class="note">${u.esc(r.note)}</div>` : ''}</div>`;
    };
    const c = G.credits();
    return `<section class="card req-card"><div class="sec-h"><h2>卒業要件</h2><span class="sub">合計 ${c.total} / ${c.required}単位</span></div>
        <div class="bar"><i style="width:${Math.min(100, (c.total / c.required) * 100).toFixed(1)}%"></i></div>
        <p class="lead" style="margin-top:8px">${u.esc(R.summary || '')}</p></section>
      <section class="card req-card"><div class="sec-h"><h2>科目区分の要件</h2></div>${R.byCategory.map(line).join('')}</section>
      <section class="card req-card"><div class="sec-h"><h2>授業形態の要件</h2></div>${R.byType.map(line).join('')}</section>
      <p class="note">このアプリで「単位GET」にした科目だけを数えています（はじめに入れた「いままでの単位」${MM.state.profile.earnedBefore}単位は合計にだけ入ります）。正式な判定はシステムWAKABAで確認してください。出典：${(R.sources || []).map((x) => `<a class="link" href="${u.esc(x)}" target="_blank" rel="noopener">${u.esc(x.replace(/^https?:\/\//, ''))}</a>`).join('、')}（${u.esc(MM.DATA.checked || '')}確認）</p>`;
  }

  V.subjects = {
    render() {
      const tabs = [['my', 'マイ科目'], ['common', '共通科目'], ['course', 'コース科目'], ['req', '卒業要件']];
      const search = ss.tab === 'common' || ss.tab === 'course'
        ? `<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><input class="input" id="subjQ" placeholder="科目名・内容でさがす" value="${u.esc(ss.q)}"></div>` : '';
      const body = { my: myHtml, common: commonHtml, course: courseHtml, req: reqHtml }[ss.tab]();
      return `<h1 class="page-title">科目の詳細</h1>
        <div class="seg">${tabs.map(([k, l]) => `<button class="${ss.tab === k ? 'on' : ''}" data-act="subjTab" data-tab="${k}">${l}</button>`).join('')}</div>
        ${search}<div id="subjBody" class="stack" style="gap:16px">${body}</div>`;
    },
    mount() {
      const q = u.$('#subjQ');
      if (q) q.addEventListener('input', () => { ss.q = q.value.trim(); const b = u.$('#subjBody'); if (b) b.innerHTML = { common: commonHtml, course: courseHtml }[ss.tab](); });
    },
    refresh() { const y = window.scrollY; const v = u.$('#view'); if (v) { v.innerHTML = V.subjects.render(); V.subjects.mount(); window.scrollTo(0, y); } },
  };

  A.subjTab = (el) => { ss.tab = el.dataset.tab; MM.refresh(); };
  A.subjCourse = (el) => { ss.course = el.dataset.c; MM.refresh(); };
  A.accToggle = (el) => {
    const id = el.dataset.id, box = el.closest('.acc');
    if (ss.open.has(id)) ss.open.delete(id); else ss.open.add(id);
    if (box) { box.classList.toggle('open', ss.open.has(id)); el.setAttribute('aria-expanded', ss.open.has(id)); }
  };
  A.registerSubj = (el) => {
    const c = MM.catalog.byId(el.dataset.id);
    if (!c) return;
    if (G.register(c)) { MM.sfx.play('get'); MM.toast(`「${u.esc(c.name)}」を今学期に登録しました`); }
    MM.refresh();
  };
  A.unregister = async (el) => {
    const s = G.subjects().find((x) => x.catId === el.dataset.id);
    if (!s) return;
    if (s.done > 0 && !(await MM.ui.confirm(`「${u.esc(s.name)}」の記録（${s.done}回ぶん）も消えます。登録をやめますか？`, 'やめる', true))) return;
    G.removeSubject(s.uid);
    MM.refresh();
  };
  A.addCustomSubj = () => {
    const ov = MM.ui.open(`<h3>自分で科目を追加</h3><div class="stack">
      <div class="field"><label for="cName">科目名</label><input class="input" id="cName" placeholder="例：〇〇の面接授業" autofocus></div>
      <div class="grid-2"><div class="field"><label for="cType">授業の形</label><select class="input" id="cType"><option value="face">面接授業</option><option value="online">オンライン授業</option><option value="live">ライブWeb授業</option><option value="broadcast">放送授業</option><option value="other">その他</option></select></div>
      <div class="field"><label for="cCred">単位</label><select class="input" id="cCred"><option value="1">1単位</option><option value="2">2単位</option></select></div></div>
      <div class="grid-2"><div class="field"><label for="cTotal">単位までの回数</label><input class="input num" id="cTotal" type="number" min="1" max="30" value="8"></div>
      <div class="field"><label for="cCat">区分</label><select class="input" id="cCat"><option value="">わからない</option><option>基盤科目</option><option>導入科目</option><option>専門科目</option><option>総合科目</option></select></div></div>
      <div class="field"><label for="cCourse">どのコースの科目？</label><select class="input" id="cCourse"><option value="">わからない・共通</option>${MM.COURSES.map((c) => `<option>${c.name}</option>`).join('')}</select></div>
      <p class="note">回数の目安：放送授業15回、面接授業8コマ、オンライン授業は1単位8コマ・2単位15コマ。</p></div>
      <div class="modal-actions"><button class="btn btn-primary" data-x="ok">追加する</button></div>`, {});
    const sync = () => { u.$('#cTotal', ov).value = G.lessonsFor(u.$('#cType', ov).value, u.$('#cCred', ov).value); };
    u.$('#cType', ov).onchange = () => { if (u.$('#cType', ov).value === 'broadcast') u.$('#cCred', ov).value = '2'; sync(); };
    u.$('#cCred', ov).onchange = sync;
    ov.querySelector('[data-x="ok"]').onclick = () => {
      const name = u.$('#cName', ov).value.trim();
      if (!name) { u.$('#cName', ov).focus(); MM.toast('科目名を入れてください'); return; }
      const course = u.$('#cCourse', ov).value;
      G.addCustom({ name, type: u.$('#cType', ov).value, credits: u.$('#cCred', ov).value, total: u.$('#cTotal', ov).value, cat: u.$('#cCat', ov).value, course, courses: course ? [course] : [] });
      MM.ui.close(ov);
      MM.sfx.play('get');
      MM.toast(`「${u.esc(name)}」を追加しました`);
      MM.refresh();
    };
  };
})();

</script>
<script>
/* まなモン：豆知識 */
(function () {
  const MM = window.MM, u = MM.u;
  const V = (MM.views = MM.views || {});
  const A = (MM.act = MM.act || {});
  const ts = { cat: 'all' };

  function pool() {
    const own = MM.state.profile.course !== 'undecided' ? MM.courseName(MM.state.profile.course) : null;
    return (window.OUJ_TIPS || []).filter((t) => !t.course || !own || t.course === own);
  }
  MM.tips = {
    today() {
      const list = pool();
      if (!list.length) return null;
      const day = Math.floor(u.pd(u.today()).getTime() / 86400000);
      return list[(day + (MM.state.tip || 0)) % list.length];
    },
    next() { MM.state.tip = (MM.state.tip || 0) + 1; MM.save(); },
  };

  function card(t, feature) {
    const fav = (MM.state.favTips || []).includes(t.id);
    const src = t.src ? `<div class="tip-src">出典：<a href="${u.esc(t.src)}" target="_blank" rel="noopener">${u.esc(t.src.replace(/^https?:\/\//, '').slice(0, 60))}</a>（${u.esc(t.checked || '')}確認）</div>` : '';
    return `<article class="tip-card ${feature ? 'feature' : ''}"><button class="fav-btn ${fav ? 'on' : ''}" data-act="favTip" data-id="${t.id}" aria-label="お気に入り">♥</button>
      <div class="tip-cat">${feature ? 'きょうのまめちしき ・ ' : ''}${u.esc(t.cat)}${t.course ? ` ・ ${u.esc(t.course)}` : ''}</div>
      <div class="tip-title">${u.esc(t.title)}</div><p class="tip-body">${u.esc(t.body)}</p>${src}
      ${feature ? '<div class="row-wrap" style="margin-top:10px"><button class="btn btn-sm" data-act="nextTip">つぎの豆知識</button></div>' : ''}</article>`;
  }

  V.tips = {
    render() {
      const all = pool();
      const cats = ['all', 'fav'].concat([...new Set(all.map((t) => t.cat))]);
      const label = (c) => (c === 'all' ? 'すべて' : c === 'fav' ? '♥ お気に入り' : c);
      const list = all.filter((t) => ts.cat === 'all' || (ts.cat === 'fav' ? (MM.state.favTips || []).includes(t.id) : t.cat === ts.cat));
      const today = MM.tips.today();
      return `<h1 class="page-title">豆知識</h1>
        <p class="lead">放送大学のこと、知っておくと得なこと、勉強のコツ。所属コースを決めると、そのコースの豆知識が出ます。</p>
        ${today ? card(today, true) : ''}
        <div class="chips-scroll">${cats.map((c) => `<button class="chip ${ts.cat === c ? 'on' : ''}" data-act="tipCat" data-c="${u.esc(c)}">${u.esc(label(c))}</button>`).join('')}</div>
        <div class="stack">${list.map((t) => card(t)).join('') || '<div class="empty">ここには まだ ありません</div>'}</div>`;
    },
    refresh() { const y = window.scrollY; const v = u.$('#view'); if (v) { v.innerHTML = V.tips.render(); window.scrollTo(0, y); } },
  };

  A.tipCat = (el) => { ts.cat = el.dataset.c; MM.refresh(); };
  A.favTip = (el) => {
    const id = el.dataset.id, f = (MM.state.favTips = MM.state.favTips || []);
    const i = f.indexOf(id);
    if (i >= 0) f.splice(i, 1); else { f.push(id); MM.sfx.play('pet'); }
    MM.save();
    u.$$(`.fav-btn[data-id="${id}"]`).forEach((b) => b.classList.toggle('on', f.includes(id)));
  };
})();

</script>
<script>
/* まなモン：設定（プロフィール・チーム図鑑・音・データ・おためし） */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const V = (MM.views = MM.views || {});
  const A = (MM.act = MM.act || {});

  function teamHtml() {
    const ms = MM.state.monsters.slice().reverse();
    if (!ms.length) return '<div class="empty">まだ なかまは いません</div>';
    return `<div class="team-list">${ms.map((m) => `<button class="team-card ${m.id === MM.state.activeId ? 'active' : ''}" data-act="renameMon" data-id="${m.id}">
      ${MM.art.html(m, { size: 92 })}<b>${u.esc(m.stage ? m.name : MM.art.formName(m.species, 0))}</b>
      <span>${u.esc(MM.art.formName(m.species, m.stage))}（${MM.art.stageLabel(m.stage)}）</span>
      <span>${MM.sem.label(m.sem)}${m.id === MM.state.activeId ? ' ・ そだて中' : ''}</span><span>${m.credits || 0}単位 ・ Lv.${G.level(m)}</span></button>`).join('')}</div>`;
  }

  V.settings = {
    render() {
      const p = MM.state.profile, c = MM.cloud;
      const where = c.ready ? 'claude.ai のあなたのアカウント（ほかの端末でも同じデータ）' : c.failed ? 'このブラウザだけ（アカウントへの保存に失敗しました）' : 'このブラウザだけ';
      return `<h1 class="page-title">設定</h1>
        <section class="card"><div class="sec-h"><h2>プロフィール</h2></div><div class="stack">
          <div class="field"><label for="pName">よびかた</label><input class="input" id="pName" maxlength="20" value="${u.esc(p.name)}"></div>
          <div class="field"><label for="pCourse">所属コース</label><select class="input" id="pCourse">${MM.courseOptions(p.course)}</select></div>
          <div class="grid-2"><div class="field"><label for="pBefore">アプリの前に とった単位</label><input class="input num" id="pBefore" type="number" min="0" max="200" inputmode="numeric" value="${p.earnedBefore}"></div>
          <div class="field"><label for="pReq">卒業に必要な単位</label><input class="input num" id="pReq" type="number" min="1" max="200" inputmode="numeric" value="${p.required}"></div></div>
          <p class="note">文系寄りの4コースだけを のせています。入れたら自動で保存されます。</p></div></section>
        <section class="card"><div class="sec-h"><h2>チーム（図鑑）</h2><span class="sub">タップで名前を変える</span></div>${teamHtml()}</section>
        <section class="card"><div class="set-row"><span class="grow"><b>音と振動</b><span>えさゲットや しんかの音</span></span><button class="switch ${p.sound ? 'on' : ''}" data-act="toggleSound" aria-label="音" aria-pressed="${p.sound}"></button></div>
          <div class="set-row"><span class="grow"><b>データの保存先</b><span>${where}</span></span></div>
          <div class="set-row"><span class="grow"><b>バックアップ</b><span>データを文字にして コピーします</span></span><button class="btn btn-sm" data-act="backup">コピー</button></div>
          <div class="set-row"><span class="grow"><b>バックアップから戻す</b><span>コピーした文字を はりつけます</span></span><button class="btn btn-sm" data-act="restore">戻す</button></div>
          <div class="set-row"><span class="grow"><b>さいしょから やりなおす</b><span>すべての記録と モンスターが消えます</span></span><button class="btn btn-sm btn-danger" data-act="resetAll">消す</button></div></section>
        <section class="card"><div class="sec-h"><h2>おためし</h2></div>
          <div class="set-row"><span class="grow"><b>学期を1つ進める</b><span>学期の終わり（チーム入り→新しいたまご）を ためせます。本当の学期とは ずれます</span></span><button class="btn btn-sm" data-act="semNext">進める</button></div>
          <div class="set-row"><span class="grow"><b>モンスターを ぜんぶ見る</b><span>6しゅるい × たまご〜きわみ（絵の確認用）</span></span><button class="btn btn-sm" data-act="gallery">見る</button></div>
          <div class="set-row"><span class="grow"><b>おためしデータを入れる</b><span>見本のデータに入れかえます（いまの記録は消えます）</span></span><button class="btn btn-sm" data-act="loadDemo">入れる</button></div></section>
        <section class="card"><div class="sec-h"><h2>このアプリについて</h2></div>
          <p class="small">まなモン（仮の名前）は、放送大学で学ぶ人のための <b>個人用・非公式</b> の勉強記録アプリです。放送大学の公式アプリではありません。</p>
          <p class="small">科目・卒業要件・日程は、放送大学の公式サイトと公式の冊子で ${u.esc(MM.DATA.checked || '')} に確認した内容です（${u.esc(MM.DATA.year || '')}）。変わることがあるので、登録や試験の前には公式サイトとシステムWAKABAで確かめてください。</p>
          <p class="note">科目データ：${(MM.catalog.all || []).length}科目　出典：${(MM.DATA.sources || []).slice(0, 4).map((s) => `<a class="link" href="${u.esc(s.url)}" target="_blank" rel="noopener">${u.esc(s.title)}</a>`).join('、')}</p></section>`;
    },
    mount() {
      const p = MM.state.profile;
      const bind = (id, fn) => { const el = u.$('#' + id); if (el) el.addEventListener('change', () => { fn(el.value); MM.save(); MM.updateTop(); }); };
      bind('pName', (v) => { p.name = v.trim(); });
      bind('pCourse', (v) => { p.course = v; MM.toast(`所属コース：${MM.courseName(v)}`); });
      bind('pBefore', (v) => { p.earnedBefore = Math.max(0, Number(v) || 0); });
      bind('pReq', (v) => { p.required = Math.max(1, Number(v) || 124); });
    },
    refresh() { const y = window.scrollY; const v = u.$('#view'); if (v) { v.innerHTML = V.settings.render(); V.settings.mount(); window.scrollTo(0, y); } },
  };

  A.renameMon = (el) => {
    const m = MM.state.monsters.find((x) => x.id === el.dataset.id);
    if (!m) return;
    if (m.stage === 0) { A.teamInfo(el); return; }
    const ov = MM.ui.open(`<h3>なまえを変える</h3>${MM.art.html(m, { size: 120, cls: 'is-happy' })}<input class="input" id="rnName" maxlength="12" value="${u.esc(m.name)}" autofocus><div class="modal-actions"><button class="btn" data-x="no">やめる</button><button class="btn btn-primary" data-x="ok">変える</button></div>`, { center: true });
    ov.querySelector('[data-x="no"]').onclick = () => MM.ui.close(ov);
    ov.querySelector('[data-x="ok"]').onclick = () => { const v = u.$('#rnName', ov).value.trim(); if (v) { m.name = v; MM.save(); } MM.ui.close(ov); MM.refresh(); };
  };
  A.backup = () => {
    const text = JSON.stringify(MM.state);
    const ov = MM.ui.open(`<h3>バックアップ</h3><p class="small muted">下の文字を メモ帳などに はりつけて保存してください。</p><textarea class="input" id="bkText" readonly>${u.esc(text)}</textarea><div class="modal-actions"><button class="btn btn-primary" data-x="copy">コピーする</button></div>`, {});
    ov.querySelector('[data-x="copy"]').onclick = () => {
      const ta = u.$('#bkText', ov);
      const fallback = () => { ta.focus(); ta.select(); MM.toast('文字を選びました。コピーしてください'); };
      try { navigator.clipboard.writeText(text).then(() => MM.toast('コピーしました'), fallback); } catch (e) { fallback(); }
    };
  };
  A.restore = () => {
    const ov = MM.ui.open(`<h3>バックアップから戻す</h3><p class="small muted">保存しておいた文字を はりつけてください。いまの記録は 入れかわります。</p><textarea class="input" id="rsText" placeholder="ここに はりつけ"></textarea><div class="modal-actions"><button class="btn btn-primary" data-x="ok">戻す</button></div>`, {});
    ov.querySelector('[data-x="ok"]').onclick = () => {
      let data = null;
      try { data = JSON.parse(u.$('#rsText', ov).value); } catch (e) { data = null; }
      if (!data || typeof data !== 'object' || !Array.isArray(data.monsters)) { MM.toast('読みこめませんでした。コピーした文字を そのまま はりつけてください'); return; }
      MM.state = MM.merge(data);
      MM.save(true);
      MM.ui.close(ov);
      MM.go('home');
      MM.toast('バックアップから戻しました');
    };
  };
  A.resetAll = async () => {
    if (!(await MM.ui.confirm('すべての記録と モンスターを消して、さいしょから やりなおしますか？ 元に戻せません。', '消す', true))) return;
    MM.state = MM.defaultState();
    MM.save(true);
    MM.go('home');
    MM.flow.onboarding();
  };
  A.semNext = async () => {
    if (!(await MM.ui.confirm('学期を1つ進めます（おためし）。育てているモンスターは チームに入ります。', '進める'))) return;
    MM.state.semShift = (MM.state.semShift || 0) + 1;
    MM.save(true);
    MM.go('home');
    MM.checkTransition();
  };
  A.gallery = () => MM.flow.gallery();
  A.loadDemo = async () => { if (await MM.ui.confirm('おためしデータに入れかえますか？ いまの記録は消えます。', '入れかえる', true)) MM.demo.load(); };
})();

</script>
<script>
/* まなモン：画面の切りかえ・タブ・起動 */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;

  const ICON = {
    home: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7v8.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    schedule: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8.5" cy="14.5" r="1.4" fill="currentColor"/><circle cx="12.5" cy="14.5" r="1.4" fill="currentColor"/></svg>',
    subjects: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5v-14A2.5 2.5 0 0 1 6.5 3H20v14.5H6.5A2.5 2.5 0 0 0 4 20a2 2 0 0 0 2.5 1.5H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M9 8h7M9 11.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    tips: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    settings: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M12 17h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15.5" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9.5" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  };
  const TABS = [['home', 'ホーム'], ['schedule', 'スケジュール'], ['subjects', '科目'], ['tips', '豆知識'], ['settings', '設定']];

  function shell() {
    u.$('#app').innerHTML = `
      <header class="topbar"><div class="brand"><span class="brand-mark">まなモン</span><span class="brand-sem" id="semLabel"></span></div>
        <div class="top-actions"><button class="food-pill" id="foodPill" data-act="openFoodBag" aria-label="えさの数"><span class="ico">🍙</span><span class="num" id="foodCount">0</span></button>
        <button class="icon-btn" id="soundBtn" data-act="toggleSound" aria-label="音のオン・オフ"></button></div></header>
      <main id="view" class="view"></main>
      <nav class="tabbar" aria-label="メニュー"><div class="tabbar-in">${TABS.map(([k, l]) => `<button class="tab" data-nav="${k}">${ICON[k]}<span>${l}</span></button>`).join('')}</div></nav>
      <div id="fx" class="fx-layer" aria-hidden="true"></div>
      <div id="overlay-root"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>`;
  }

  MM.updateTop = () => {
    const fc = u.$('#foodCount'); if (fc) fc.textContent = MM.foodTotal();
    const sl = u.$('#semLabel'); if (sl) sl.textContent = MM.sem.label(MM.sem.current()) + (MM.state.semShift ? '（おためし）' : '');
    const sb = u.$('#soundBtn'); if (sb) { sb.innerHTML = MM.state.profile.sound ? ICON.soundOn : ICON.soundOff; sb.setAttribute('aria-pressed', String(!!MM.state.profile.sound)); }
    const cf = u.$('#careFood'); if (cf) cf.textContent = `えさ ${MM.foodTotal()}こ`;
  };

  MM.view = 'home';
  MM.go = (name) => {
    const old = MM.views[MM.view];
    if (old && old.unmount) old.unmount();
    MM.view = MM.views[name] ? name : 'home';
    u.$$('.tab').forEach((t) => t.classList.toggle('on', t.dataset.nav === MM.view));
    const v = MM.views[MM.view];
    u.$('#view').innerHTML = v.render();
    if (v.mount) v.mount();
    window.scrollTo(0, 0);
    MM.updateTop();
  };
  MM.refresh = (opt) => {
    const v = MM.views[MM.view];
    if (!v) return;
    if (v.refresh) v.refresh(opt);
    else { u.$('#view').innerHTML = v.render(); if (v.mount) v.mount(); }
    MM.updateTop();
  };
  MM.checkTransition = () => {
    if (!MM.state.onboarded || (MM.flow && MM.flow.busy) || MM.ui.top()) return;
    const t = G.transition();
    if (t) { MM.flow.transition(t); return; }
    const m = G.active();
    if (m && m.stage === 0 && (m.warmth || 0) >= G.HATCH_AT) MM.flow.hatch();
  };

  document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      if (u.$('#overlay-root').contains(nav)) MM.ui.close();
      MM.go(nav.dataset.nav);
      MM.sfx.play('tap');
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act) { const fn = MM.act[act.dataset.act]; if (fn) fn(act, e); return; }
    if (e.target.closest('#activeWrap .mon')) MM.act.pet();
  });
  document.addEventListener('pointerdown', () => { if (MM.state && MM.state.profile.sound) MM.sfx.ac(); }, { once: true });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const ov = MM.ui.top();
    if (ov && !(ov._opt && ov._opt.locked)) MM.ui.close(ov);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !MM.state) return;
    if (MM.view === 'home' && MM.views.home.tick) MM.views.home.tick();
    MM.checkTransition();
  });

  function boot() {
    MM.load();
    shell();
    MM.go('home');
    if (!MM.state.onboarded) MM.flow.onboarding();
    else MM.checkTransition();
    MM.on('replaced', () => {
      u.$$('#overlay-root > .overlay').forEach((ov) => ov.remove());
      if (MM.flow) MM.flow.busy = false;
      MM.go('home');
      if (!MM.state.onboarded) MM.flow.onboarding();
      else { MM.toast('アカウントに保存された記録を読みこみました'); MM.checkTransition(); }
    });
    MM.on('cloud', () => { if (MM.view === 'settings') MM.refresh(); });
    MM.initCloud();
    setInterval(() => { if (MM.view === 'home' && MM.views.home.tick) MM.views.home.tick(); }, 60000);
  }
  boot();
})();

</script>
</body>
</html>
