<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17A388">
<title>まなモン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* layout: スマホ幅の1列。上に飼育ケース（モンスター）、下に方眼ノート風の勉強カード。下に5つのタブ */
:root {
  --bg: #F2F6EF;          /* 方眼ノートの紙 */
  --grid: #E4ECE1;        /* 方眼の線 */
  --surface: #FFFFFF;
  --surface-2: #F6FAF4;
  --ink: #2F2B45;         /* 藍色インク */
  --ink-soft: #5D5876;
  --muted: #858199;
  --line: #DCE4D9;
  --wakaba: #15A086;      /* 若葉色（アクセント） */
  --wakaba-ink: #0D7764;
  --wakaba-soft: #D6F1E8;
  --sun: #FFC23E;         /* えさ・星 */
  --sun-ink: #8A5A00;
  --sun-soft: #FFF0C4;
  --coral: #FF6F63;       /* ハート */
  --coral-soft: #FFE2DE;
  --sky-1: #BDE5FF;
  --sky-2: #ECF8FF;
  --ground-1: #A8DD8A;
  --ground-2: #8BCB6E;
  --cloud: rgba(255, 255, 255, .88);
  --good: #23905A;
  --warn: #C9790E;
  --bad: #D24B47;
  --on-accent: #FFFFFF;
  --scrim: rgba(31, 28, 48, .46);
  --shadow: 0 4px 14px rgba(47, 43, 69, .09);
  --shadow-lg: 0 16px 44px rgba(47, 43, 69, .22);
  --font-display: "Mochiy Pop One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --tabbar-h: 70px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151925; --grid: #1C2130; --surface: #1F2433; --surface-2: #252B3C;
    --ink: #EEF0F8; --ink-soft: #C4C8DA; --muted: #9399B0; --line: #30374B;
    --wakaba: #33CDAC; --wakaba-ink: #82E7D0; --wakaba-soft: #163A35;
    --sun: #FFD15C; --sun-ink: #FFE3A0; --sun-soft: #3A321E;
    --coral: #FF877B; --coral-soft: #3E2427;
    --sky-1: #1C2A55; --sky-2: #34427D; --ground-1: #3D6A49; --ground-2: #315A3D; --cloud: rgba(255, 255, 255, .13);
    --good: #4CC786; --warn: #F0AA42; --bad: #FF6F6A; --on-accent: #0F1A18;
    --scrim: rgba(4, 6, 12, .62);
    --shadow: 0 4px 14px rgba(0, 0, 0, .32); --shadow-lg: 0 16px 44px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151925; --grid: #1C2130; --surface: #1F2433; --surface-2: #252B3C;
  --ink: #EEF0F8; --ink-soft: #C4C8DA; --muted: #9399B0; --line: #30374B;
  --wakaba: #33CDAC; --wakaba-ink: #82E7D0; --wakaba-soft: #163A35;
  --sun: #FFD15C; --sun-ink: #FFE3A0; --sun-soft: #3A321E;
  --coral: #FF877B; --coral-soft: #3E2427;
  --sky-1: #1C2A55; --sky-2: #34427D; --ground-1: #3D6A49; --ground-2: #315A3D; --cloud: rgba(255, 255, 255, .13);
  --good: #4CC786; --warn: #F0AA42; --bad: #FF6F6A; --on-accent: #0F1A18;
  --scrim: rgba(4, 6, 12, .62);
  --shadow: 0 4px 14px rgba(0, 0, 0, .32); --shadow-lg: 0 16px 44px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--wakaba); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100%;
  position: relative;
  padding-inline: 16px;
  padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px));
}

/* ---------- 上のバー ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin-inline: -16px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand-mark { font-family: var(--font-display); font-size: 22px; color: var(--wakaba-ink); letter-spacing: .02em; white-space: nowrap; }
.brand-sem { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.food-pill {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; border-radius: 999px; padding: 5px 12px 5px 9px;
  background: var(--sun-soft); color: var(--sun-ink); font-weight: 800;
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sun) 55%, transparent);
}
.food-pill .ico { font-size: 17px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 0;
  display: inline-grid; place-items: center;
  background: var(--surface); color: var(--ink-soft); box-shadow: var(--shadow);
}
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- 下のタブ ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -6px 20px rgba(0, 0, 0, .05);
}
.tabbar-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab {
  border: 0; background: none; padding: 6px 2px 4px; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-size: 11px; font-weight: 700; min-width: 0;
}
.tab svg { width: 26px; height: 26px; }
.tab span { white-space: nowrap; }
.tab.on { color: var(--wakaba-ink); background: var(--wakaba-soft); }

/* ---------- 共通部品 ---------- */
.view { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
.card {
  background: var(--surface); border-radius: var(--r-lg); padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sec-h h2 { font-family: var(--font-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; }
.sec-h .sub { font-size: 12px; color: var(--muted); }
.page-title { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 4px 2px 0; }
.lead { color: var(--ink-soft); font-size: 13px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.spacer { flex: 1; }

.btn {
  border: 0; border-radius: 14px; padding: 10px 16px; font-weight: 800; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line);
  transition: transform .08s ease;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--wakaba); color: var(--on-accent); box-shadow: 0 4px 0 var(--wakaba-ink); }
.btn-primary:active { box-shadow: 0 1px 0 var(--wakaba-ink); transform: translateY(3px); }
.btn-sun { background: var(--sun); color: #4A3300; box-shadow: 0 4px 0 color-mix(in srgb, var(--sun) 60%, #6B4A00); }
.btn-sun:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--sun) 60%, #6B4A00); transform: translateY(3px); }
.btn-danger { background: var(--coral-soft); color: var(--bad); box-shadow: none; }
.btn-ghost { background: none; box-shadow: none; color: var(--ink-soft); padding-inline: 8px; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chip {
  border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  background: var(--surface-2); color: var(--ink-soft); box-shadow: inset 0 0 0 1.5px var(--line);
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
}
.chip.on { background: var(--wakaba); color: var(--on-accent); box-shadow: none; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chips-scroll .chip { flex: none; }

.badge {
  display: inline-flex; align-items: center; gap: 3px; border-radius: 8px; padding: 1px 7px;
  font-size: 11px; font-weight: 800; background: var(--surface-2); color: var(--ink-soft);
  box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap;
}
.badge.b-tv { background: #E7F0FF; color: #2C5BB8; box-shadow: none; }
.badge.b-radio { background: #FFF0E0; color: #A55A10; box-shadow: none; }
.badge.b-face { background: var(--coral-soft); color: var(--bad); box-shadow: none; }
.badge.b-online { background: var(--wakaba-soft); color: var(--wakaba-ink); box-shadow: none; }
.badge.b-ok { background: var(--wakaba); color: var(--on-accent); box-shadow: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px 4px; font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.input, select.input, textarea.input {
  width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1.5px var(--line); min-width: 0;
}
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--wakaba); }
textarea.input { min-height: 120px; resize: vertical; font-size: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.bar { height: 12px; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--wakaba); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar.sun > i { background: var(--sun); }
.bar.coral > i { background: var(--coral); }

.stars { color: var(--sun); letter-spacing: 1px; font-size: 14px; white-space: nowrap; }
.stars .off { color: var(--line); }

.switch { position: relative; width: 50px; height: 30px; border: 0; border-radius: 99px; background: var(--line); flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); transition: transform .2s; }
.switch.on { background: var(--wakaba); }
.switch.on::after { transform: translateX(20px); }

.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.list-row:last-child { border-bottom: 0; }
.list-row .grow { flex: 1; min-width: 0; }

.empty {
  text-align: center; padding: 22px 12px; color: var(--muted); font-size: 13px;
  border: 2px dashed var(--line); border-radius: var(--r-md);
}
.empty b { color: var(--ink-soft); display: block; font-size: 15px; margin-bottom: 4px; }
.note { font-size: 11px; color: var(--muted); line-height: 1.5; }
.link { color: var(--wakaba-ink); font-weight: 700; text-decoration: none; }
.link:hover { text-decoration: underline; }
.demo-banner {
  background: var(--sun-soft); color: var(--sun-ink); border-radius: var(--r-md); padding: 10px 14px;
  font-size: 13px; display: flex; align-items: center; gap: 10px; justify-content: space-between;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
<style>
/* ---------- 飼育ケース（ホーム上部） ---------- */
.habitat {
  position: relative; height: 300px; border-radius: var(--r-lg); overflow: hidden;
  background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 70%);
  box-shadow: var(--shadow); border: 1px solid var(--line);
  isolation: isolate;
}
.habitat::before, .habitat::after {
  content: ""; position: absolute; border-radius: 99px; background: var(--cloud);
  z-index: 0; animation: cloud 38s linear infinite;
}
.habitat::before { width: 74px; height: 22px; top: 40px; left: -80px; box-shadow: 26px -10px 0 4px var(--cloud); }
.habitat::after { width: 54px; height: 16px; top: 82px; left: -60px; animation-duration: 52s; animation-delay: -20s; }
@keyframes cloud { to { transform: translateX(560px); } }
.ground {
  position: absolute; left: -10%; right: -10%; bottom: -60px; height: 128px; border-radius: 50% 50% 0 0;
  background: radial-gradient(ellipse at 50% 0%, var(--ground-1), var(--ground-2) 70%); z-index: 1;
}
.ground::before {
  content: ""; position: absolute; inset: 14px 18% auto; height: 10px; border-radius: 99px;
  background: color-mix(in srgb, var(--surface) 25%, transparent);
}
.hab-stats { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; }
.stat {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 99px;
  background: color-mix(in srgb, var(--surface) 88%, transparent); font-size: 11px; font-weight: 800; color: var(--ink-soft);
  box-shadow: var(--shadow);
}
.stat .mini { width: 46px; height: 7px; border-radius: 9px; background: var(--line); overflow: hidden; }
.stat .mini i { display: block; height: 100%; border-radius: 9px; background: var(--sun); }
.stat.mood .mini i { background: var(--coral); }
.stat.lv { color: var(--wakaba-ink); }
.nameplate {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 6;
  background: var(--surface); border-radius: 99px; padding: 3px 14px; font-weight: 800; font-size: 13px;
  box-shadow: var(--shadow); white-space: nowrap; display: flex; align-items: center; gap: 8px;
}
.stage-dots { display: inline-flex; gap: 3px; }
.stage-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.stage-dots i.on { background: var(--sun); }

.team-row { position: absolute; left: 0; right: 0; bottom: 46px; height: 70px; z-index: 2; pointer-events: none; }
.team-mate { position: absolute; bottom: 0; pointer-events: auto; cursor: pointer; }
.active-wrap {
  position: absolute; left: 50%; bottom: 40px; z-index: 4; width: 0; height: 0;
  transition: transform 2.4s ease-in-out;
}
.active-wrap .mon { position: absolute; left: 0; bottom: 0; transform: translateX(-50%); cursor: pointer; }
.speech {
  position: absolute; z-index: 7; left: 50%; top: 46px; transform: translateX(-50%);
  max-width: 78%; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 7px 13px;
  font-size: 13px; font-weight: 700; box-shadow: var(--shadow); text-align: center;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
}
.speech.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.speech::after {
  content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
  border: 7px solid transparent; border-bottom: 0; border-top-color: var(--surface);
}

/* ---------- モンスター（絵は js/monsters.js、無ければ仮の絵） ---------- */
.mon { position: relative; width: var(--size, 150px); height: var(--size, 150px); }
.mon-flip { width: 100%; height: 100%; transition: transform .3s; }
.mon.face-left .mon-flip { transform: scaleX(-1); }
.mon-bob { width: 100%; height: 100%; transform-origin: 50% 95%; animation: mon-bob 2.6s ease-in-out infinite; }
.mon-bob svg, .mon-bob img { width: 100%; height: 100%; display: block; overflow: visible; }
.mon::after {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: 2%; height: 9%; border-radius: 50%;
  background: rgba(0, 0, 0, .14); z-index: -1; filter: blur(1px);
}
.mon.floaty::after { opacity: .5; transform: scale(.8); }
@keyframes mon-bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4%) scale(.985, 1.02); } }
.mon.floaty .mon-bob { animation: mon-float 3.4s ease-in-out infinite; }
@keyframes mon-float { 0%, 100% { transform: translateY(-3%) rotate(-2deg); } 50% { transform: translateY(-11%) rotate(2deg); } }

.m-eyes, .m-cheeks, .m-wiggle, .m-egg, .m-crack { transform-box: fill-box; transform-origin: center; }
.m-eyes { transition: transform .07s; }
.mon.blink .m-eyes { transform: scaleY(.12); }
.m-mouth-open, .m-crack, .m-happy-eyes { display: none; }
.m-wiggle { animation: wiggle 1.8s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

.mon.is-eating .mon-bob { animation: chew .32s ease-in-out infinite; }
.mon.is-eating .m-mouth-open { display: inline; animation: blink-on .32s steps(1) infinite; }
.mon.is-eating .m-mouth-closed { animation: blink-off .32s steps(1) infinite; }
@keyframes chew { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, .93); } }
@keyframes blink-on { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes blink-off { 0% { opacity: 0; } 50% { opacity: 1; } }

.mon.is-happy .mon-bob { animation: hop .45s cubic-bezier(.3, .7, .4, 1) 3; }
.mon.is-happy .m-cheeks { filter: saturate(2.2) brightness(1.05); transform: scale(1.25); }
.mon.is-happy .m-eyes { display: none; }
.mon.is-happy .m-happy-eyes { display: inline; }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(0) scale(1.1, .88); } 60% { transform: translateY(-22%) scale(.94, 1.08); } }

.mon.is-bath .mon-bob { animation: shiver .18s linear infinite; }
@keyframes shiver { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-3%) rotate(-3deg); } 75% { transform: translateX(3%) rotate(3deg); } }
.mon.is-play .mon-bob { animation: spin-jump .9s cubic-bezier(.3, .7, .4, 1) 2; }
@keyframes spin-jump { 0% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-30%) rotate(180deg); } 100% { transform: translateY(0) rotate(360deg); } }
.mon.is-sad .mon-bob { animation: sad-sway 4s ease-in-out infinite; filter: saturate(.75); }
@keyframes sad-sway { 0%, 100% { transform: rotate(-3deg) translateY(2%); } 50% { transform: rotate(3deg) translateY(2%); } }

.mon.is-egg .mon-bob { animation: egg-rock 3.2s ease-in-out infinite; transform-origin: 50% 92%; }
@keyframes egg-rock { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-7deg); } 84% { transform: rotate(6deg); } 92% { transform: rotate(-3deg); } }
.mon.is-hatching .mon-bob { animation: egg-shake .11s linear infinite; }
.mon.is-hatching .m-crack { display: inline; }
@keyframes egg-shake { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

/* ---------- 演出 ---------- */
.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.fx-p { position: absolute; left: 0; top: 0; font-size: 22px; line-height: 1; will-change: transform, opacity; }
.fx-text {
  position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 22px; color: var(--sun-ink);
  -webkit-text-stroke: 5px var(--surface); paint-order: stroke fill; white-space: nowrap; will-change: transform, opacity;
}
.flash { position: fixed; inset: 0; background: #fff; z-index: 95; pointer-events: none; animation: flash .7s ease-out forwards; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }

.toast-root { position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }

(function () {

    // ---------- 放送大学の豆知識 ----------
    { id: 'f01', cat: '放送大学の豆知識', title: '「共通科目」は いまは「基盤科目」', body: '2016年度にカリキュラムが変わり、どのコースの人も取れる科目は「基盤科目」という名前になりました。旧カリキュラムの「共通科目」という区分は、いまはありません。', src: 'https://www.ouj.ac.jp/gakubu/about/saihen/', checked: C },
    { id: 'f02', cat: '放送大学の豆知識', title: '科目名の（\'24）は 開設された年', body: '科目名のうしろの（\'24）などは、その科目ができた年度の下2けたです。1つの科目は4〜6年くらい放送されます。', src: 'https://tobe.ouj.ac.jp/credit/', checked: C },
    { id: 'f03', cat: '放送大学の豆知識', title: '放送授業は 45分×15回で2単位', body: '放送授業は1科目2単位。学期ごとに週1回・45分の授業が15回あります。テレビ科目はBS231ch（一部232ch）、ラジオ科目はBS531chで、ほとんどがインターネットでも見られます。', src: SHIORI, checked: C },
    { id: 'f04', cat: '放送大学の豆知識', title: '面接授業は 1科目1単位・全8回', body: '面接授業（スクーリング）は90分×7回＋45分×1回で1単位。全国の学習センターなどで受けられ、所属していないセンターの授業も受けられます。年に約2,700クラスあり、約8割が土日です。', src: 'https://www.ouj.ac.jp/reasons-to-choose-us/anytime-anyone-can-learn-freely/schooling/', checked: C },
    { id: 'f05', cat: '放送大学の豆知識', title: 'オンライン授業は 試験なし', body: 'オンライン授業は1単位8コマ・2単位15コマ。1コマは講義45分＋課題45分くらいで、ネットだけで完結します。通信指導や単位認定試験は（一部の科目をのぞき）ありません。卒業要件では面接授業と同じあつかいです。', src: SHIORI, checked: C },
    { id: 'f06', cat: '放送大学の豆知識', title: '成績は Ⓐ・A・B・C で合格', body: '成績はⒶ（90点以上）・A（80点）・B（70点）・C（60点）が合格、D・Eは不合格です。60点以上で単位がもらえます。', src: 'https://www.ouj.ac.jp/news/2025/information/11-26.html', checked: C },
    { id: 'f07', cat: '放送大学の豆知識', title: '全国57か所の学びの拠点', body: '学習センター50か所とサテライトスペース7か所。大学のキャンパスの中にあるセンターも多く、面接授業や相談、過去問の閲覧などに使えます。月曜・火曜が休みのところが多いので、行く前に確認を。', src: 'https://www.ouj.ac.jp/about/ouj/center/', checked: C },

    // ---------- 知っておくと有利 ----------

    { id: 'a02', cat: '知っておくと有利', title: '過去問は WAKABA と学習センターで', body: '過去の単位認定試験の問題は、システムWAKABAと学習センターで見られます。問題は全科目、解答は講師が了承した科目だけ（ない科目は「解答のポイント」）。', src: SHIORI, checked: C },
    { id: 'a03', cat: '知っておくと有利', title: '学割証で JR が2割引', body: '全科履修生は、所属の学習センターで学割証（学校学生生徒旅客運賃割引証）を出してもらえます。面接授業で遠くへ行くときに便利です。休学中は使えません。', src: SHIORI, checked: C },

    { id: 'a05', cat: '知っておくと有利', title: '図書館の電子ブックは 家から読める', body: '千葉の本部にある附属図書館（約74万冊）の電子ブックなどは、WAKABAと同じIDで自宅からも使えます。', src: SHIORI, checked: C },

    { id: 'a08', cat: '知っておくと有利', title: '面接授業は 1学期15科目まで', body: 'Web申請なら放送授業・オンライン授業の登録に上限はありません。面接授業は、抽選の結果で15科目まで。人気の授業は抽選になるので、第2希望も考えておくと安心です。', src: 'https://www.ouj.ac.jp/gakubu/about/schedule/kguide.pdf', checked: C },
    { id: 'a09', cat: '知っておくと有利', title: '面接授業は 追加登録のチャンスも', body: '学期が始まってから、空いている面接授業に追加で申しこめる期間があります（2026年度第2学期は10月16日に空席発表）。カレンダーの📣で日程を確認できます。', src: 'https://mensetsu-cnh.ouj.ac.jp/2/add-registration/', checked: C },
    { id: 'a10', cat: '知っておくと有利', title: '取れる資格・受験資格', body: '卒業や所定の単位で、社会福祉主事任用資格、認定心理士、学芸員などにつながります。所定の単位で、税理士・社会保険労務士・保育士などの試験の受験資格になる場合もあります。条件は年度で変わるので公式の案内で確認を。', src: SHIORI, checked: C },
    { id: 'a11', cat: '知っておくと有利', title: '体育実技は 閉講へ', body: '基盤科目（保健体育）の「体育実技」は、2027年度第1学期から新しい登録ができなくなり、2030年度末で閉講の予定です。', src: 'https://www.ouj.ac.jp/news/2026/information/5-37.html', checked: C },

    { id: 's02', cat: '勉強のコツ', title: '1回分の目安は 約5時間', body: '公式の目安は、テキスト1章に3時間くらい、放送1回の復習に2時間くらい。「テキスト → 放送 → 復習」が基本の流れです。', src: 'https://www.ouj.ac.jp/news/2025/information/11-26.html', checked: C },
    { id: 's03', cat: '勉強のコツ', title: '最初の学期は 少なめに', body: '最初は科目数をひかえめにして、自分のペースをつかむのがおすすめです。4年で卒業するなら1学期15〜16単位（約8科目）ですが、実際は1学期4〜5科目の人が多いそうです。', src: 'https://www.ouj.ac.jp/help/faq/03/', checked: C },
    { id: 's04', cat: '勉強のコツ', title: '通信指導は 試験の入場券', body: '通信指導を出して合格することが、単位認定試験を受ける条件です。採点されるのは1回目の提出だけなので、落ち着いて見直してから出しましょう。', src: 'https://www.ouj.ac.jp/for-students/webtsushin/2026/', checked: C },
    { id: 's05', cat: '勉強のコツ', title: 'Web試験は 体験版で練習', body: '単位認定試験はWeb受験（1科目50分・1回だけ）。本番の前に、公式の体験版で操作を試しておくと安心です。', src: 'https://www.ouj.ac.jp/for-students/webshiken/2026/', checked: C },
    { id: 's06', cat: '勉強のコツ', title: '基盤 → 導入 → 専門 → 総合', body: '科目は「基盤 → 導入 → 専門 → 総合」の順に進むのが目安です。日本語リテラシーや統計、外国語などの基盤科目は早めに取ると、あとの科目が楽になります。', src: 'https://tobe.ouj.ac.jp/credit/', checked: C },
    { id: 's07', cat: '勉強のコツ', title: '読むより「思い出す」', body: 'テキストを読み返すより、本を閉じて「いまの章のポイントは？」と思い出すほうが記憶に残ります（テストの効果）。過去問を解くのも同じ効果があります。' },
    { id: 's08', cat: '勉強のコツ', title: '一気にやらず 間をあける', body: '同じ時間でも、1日でまとめてやるより、何日かに分けて くり返すほうが長く覚えていられます（分散学習）。時間割で週2〜3回に分けるのがおすすめ。' },
    { id: 's09', cat: '勉強のコツ', title: '25分だけ やってみる', body: 'やる気が出ないときは「25分だけ」と決めて始めて、5分休む。始めてしまえば続くことが多いです。1回分が終わったら、このアプリで「やった！」を押して えさをもらいましょう。' },
    { id: 's10', cat: '勉強のコツ', title: 'わからないことは 質問できる', body: '授業でわからないところは「質問箱」や「質問票」で主任講師に質問できます。勉強のなやみは学習センターでも相談できます。', src: SHIORI, checked: C },

    { id: 'o01', cat: 'おもしろ知識', title: '最初の放送授業は 1985年', body: '1981年に放送大学学園ができ、1983年に大学を設置、1985年4月に放送授業が始まりました。最初の卒業式は1989年4月です。', src: HIST, checked: C },

    { id: 'o05', cat: 'おもしろ知識', title: '本部は 千葉市の「若葉」', body: '本部は千葉県千葉市美浜区若葉。千葉学習センター、附属図書館、泊まれるセミナーハウスが同じ敷地にあります。', src: 'https://www.ouj.ac.jp/about/ouj/center/', checked: C },

    const horns = `<path d="M76 ${n(c.cy - c.ry + 9)} Q${n(65 - st)} ${n(c.cy - c.ry - 16)} ${n(73 - st)} ${n(c.cy - c.ry - 22)} Q84 ${n(c.cy - c.ry - 5)} 88 ${n(c.cy - c.ry + 6)} Z" fill="${p.horn}" ${S}/><path d="M124 ${n(c.cy - c.ry + 9)} Q${n(135 + st)} ${n(c.cy - c.ry - 16)} ${n(127 + st)} ${n(c.cy - c.ry - 22)} Q116 ${n(c.cy - c.ry - 5)} 112 ${n(c.cy - c.ry + 6)} Z" fill="${p.horn}" ${S}/>`;
    const wings = `<g class="m-wiggle"><path d="M57 ${n(c.cy - 9)} Q${n(22 - st * 3)} ${n(c.cy - 45)} ${n(18 - st)} ${n(c.cy + 1)} Q35 ${n(c.cy - 6)} 43 ${n(c.cy + 18)} Q52 ${n(c.cy + 3)} 61 ${n(c.cy + 15)} Z" fill="${p.accent}" ${S}/></g><g class="m-wiggle"><path d="M143 ${n(c.cy - 9)} Q${n(178 + st * 3)} ${n(c.cy - 45)} ${n(182 + st)} ${n(c.cy + 1)} Q165 ${n(c.cy - 6)} 157 ${n(c.cy + 18)} Q148 ${n(c.cy + 3)} 139 ${n(c.cy + 15)} Z" fill="${p.accent}" ${S}/></g>`;
    const tail = `<g class="m-wiggle"><path d="M144 ${n(c.cy + 29)} Q170 ${n(c.cy + 42)} ${n(178 + st)} ${n(c.cy + 12)} Q161 ${n(c.cy + 26)} 142 ${n(c.cy + 12)} Z" fill="${p.main}" ${S}/><path d="M${n(178 + st)} ${n(c.cy + 3)} l9 9 l-9 9 l-9 -9 Z" fill="${p.accent}" ${S}/></g>`;
    const scales = st >= 2 ? `<path d="M83 ${n(c.cy + 12)} h34 M88 ${n(c.cy + 23)} h24 M93 ${n(c.cy + 34)} h14" fill="none" stroke="${p.accent}" stroke-width="3" stroke-linecap="round" opacity=".55"/>` : '';
    return { back: wings + horns + tail, front: scales, belly: true };
  }

  function fishParts(p, c, st) {
    const tail = `<g class="m-wiggle"><path d="M145 ${n(c.cy)} L${n(177 + st * 3)} ${n(c.cy - 32 - st)} Q${n(166 + st)} ${n(c.cy)} ${n(177 + st * 3)} ${n(c.cy + 32 + st)} Z" fill="${p.accent}" ${S}/></g>`;
    const top = `<path d="M79 ${n(c.cy - c.ry + 9)} Q100 ${n(c.cy - c.ry - 27 - st * 2)} 122 ${n(c.cy - c.ry + 10)} Z" fill="${p.accent}" ${S}/>`;
    const fins = `<g class="m-wiggle"><ellipse cx="55" cy="${n(c.cy + 20)}" rx="${n(12 + st)}" ry="7" fill="${p.accent}" ${S} transform="rotate(30 55 ${n(c.cy + 20)})"/></g><g class="m-wiggle"><ellipse cx="145" cy="${n(c.cy + 20)}" rx="${n(12 + st)}" ry="7" fill="${p.accent}" ${S} transform="rotate(-30 145 ${n(c.cy + 20)})"/></g>`;
    const scales = st >= 2 ? `<path d="M70 ${n(c.cy - 19)} q6 6 12 0 M88 ${n(c.cy - 25)} q6 6 12 0 M106 ${n(c.cy - 25)} q6 6 12 0 M124 ${n(c.cy - 19)} q6 6 12 0" fill="none" stroke="${p.accent}" stroke-width="3" stroke-linecap="round" opacity=".72"/>` : '';
    const bubbles = `<circle cx="34" cy="${n(c.cy - 57)}" r="${st >= 3 ? 6 : 4}" fill="${WHITE}" fill-opacity=".62" stroke="${INK}" stroke-width="3"/><circle cx="25" cy="${n(c.cy - 33)}" r="4" fill="${WHITE}" fill-opacity=".58" stroke="${INK}" stroke-width="3"/>`;
    return { back: tail + top, front: fins + scales + bubbles, belly: true };
  }

  function birdParts(p, c, st) {
    const crest = `<g class="m-wiggle"><path d="M94 ${n(c.cy - c.ry + 7)} Q${n(82 - st)} ${n(c.cy - c.ry - 20)} 98 ${n(c.cy - c.ry - 24)} Q106 ${n(c.cy - c.ry - 8)} 101 ${n(c.cy - c.ry + 7)} Z" fill="${p.accent}" ${S}/></g>`
      + (st >= 2 ? `<g class="m-wiggle"><path d="M104 ${n(c.cy - c.ry + 7)} Q${n(118 + st)} ${n(c.cy - c.ry - 15)} ${n(126 + st)} ${n(c.cy - c.ry - 10)} Q116 ${n(c.cy - c.ry)} 107 ${n(c.cy - c.ry + 8)} Z" fill="${p.accent}" ${S}/></g>` : '');
    const wings = `<g class="m-wiggle"><path d="M57 ${n(c.cy - 5)} Q${n(26 - st)} ${n(c.cy + 9)} ${n(42 - st)} ${n(c.cy + 36)} Q52 ${n(c.cy + 26)} 63 ${n(c.cy + 19)} Z" fill="${p.accent}" ${S}/></g><g class="m-wiggle"><path d="M143 ${n(c.cy - 5)} Q${n(174 + st)} ${n(c.cy + 9)} ${n(158 + st)} ${n(c.cy + 36)} Q148 ${n(c.cy + 26)} 137 ${n(c.cy + 19)} Z" fill="${p.accent}" ${S}/></g>`;
    const featherLines = st >= 3 ? `<path d="M49 ${n(c.cy + 13)} q9 8 18 3 M151 ${n(c.cy + 13)} q-9 8 -18 3" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" opacity=".55"/>` : '';
    return { back: crest + wings, front: featherLines, belly: true };
  }

  const builders = { shark: sharkParts, turtle: turtleParts, dino: dinoParts, dragon: dragonParts, fish: fishParts, bird: birdParts };

  function prize(id, p, c, st) {
    if (st < 4) return '';
    const crownFill = id === 'fish' ? '#BDEBFF' : '#FFD54A';
    const aura = id === 'fish' ? `<path d="M30 78 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 Z" fill="#BDEBFF"/><path d="M168 88 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 Z" fill="#BDEBFF"/>` : `<path d="M27 69 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 Z" fill="#FFD54A"/><path d="M169 81 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 Z" fill="#FFD54A"/>`;
    return `${aura}<path d="M79 ${n(c.cy - c.ry - 1)} L83 ${n(c.cy - c.ry - 24)} L94 ${n(c.cy - c.ry - 11)} L101 ${n(c.cy - c.ry - 30)} L108 ${n(c.cy - c.ry - 11)} L118 ${n(c.cy - c.ry - 24)} L122 ${n(c.cy - c.ry - 1)} Z" fill="${crownFill}" ${S}/><circle cx="101" cy="${n(c.cy - c.ry - 11)}" r="4" fill="#FF6F8E"/>`;
  }

  function creature(id, st) {
    const p = PAL[id];
    const c = CFG[st];
    const parts = builders[id](p, c, st);
    const bodyFill = parts.bodyFill || p.main;
    const body = id === 'fish'
      ? `<path d="M44 ${c.cy} Q61 ${n(c.cy - c.ry)} 102 ${n(c.cy - c.ry)} Q139 ${n(c.cy - c.ry)} 156 ${c.cy} Q139 ${n(c.cy + c.ry)} 102 ${n(c.cy + c.ry)} Q61 ${n(c.cy + c.ry)} 44 ${c.cy} Z" fill="${bodyFill}" ${S}/>`
      : `<ellipse cx="100" cy="${c.cy}" rx="${c.rx}" ry="${c.ry}" fill="${bodyFill}" ${S}/>`;
    const belly = parts.belly ? (id === 'fish'
      ? `<path d="M72 ${n(c.cy + 17)} Q100 ${n(c.cy + 38)} 130 ${n(c.cy + 16)} Q103 ${n(c.cy + 28)} 72 ${n(c.cy + 17)} Z" fill="${p.belly}" opacity=".95"/>`
      : `<ellipse cx="100" cy="${n(c.cy + 19)}" rx="${n(c.rx * .56)}" ry="${n(c.ry * .43)}" fill="${p.belly}" opacity=".96"/>`) : '';
    return svg(`<g class="m-body">${parts.back}${feet(id, p, c, st)}${body}${belly}${parts.front}${face(id, p, c, st)}${prize(id, p, c, st)}</g>`);
  }

  const art = {};
  Object.keys(PAL).forEach((id) => {
    art[id] = { egg: egg(id) };
    [1, 2, 3, 4].forEach((st) => { art[id][st] = creature(id, st); });
  });
  window.MONSTER_ART = art;
})();

</script>
<script>
/*
  仮のモンスター絵（Codex の本番の絵が入るまでの代わり）
  ・js/monsters.js の MONSTER_ART に絵が無いときだけ使う
  ・アニメ用の部品名（class）は本番の絵でも同じものを使う → Codex指示書を参照
*/
(function () {
  const INK = '#3B2F52';
  const PAL = {
    shark:  { main: '#8CCBF2', belly: '#F4FBFF', accent: '#5FA6DB', egg: '#CBE9FB', mark: '#76B8E6' },
    turtle: { main: '#BDE7A2', belly: '#F3FBEA', accent: '#4E9F6A', egg: '#D6F2C9', mark: '#69B67A', rim: '#CFEFB8' },
    dino:   { main: '#FFBE7A', belly: '#FFF1DC', accent: '#F27B5B', egg: '#FFE1BC', mark: '#F59A6C' },
    dragon: { main: '#C9B0FF', belly: '#FFF3DA', accent: '#9C7CF0', egg: '#E6DBFF', mark: '#A98CF2', horn: '#FFD978' },
    fish:   { main: '#FFA6C1', belly: '#FFE9F0', accent: '#FF7EA4', egg: '#FFD9E5', mark: '#FF96B6' },
    bird:   { main: '#FFE27A', belly: '#FFF9DF', accent: '#FFB13D', egg: '#FFF1B8', mark: '#F2BE45', beak: '#FF9F43' },
  };
  const F = [0, .78, .92, 1.05, 1.16];
  const n = (v) => +v.toFixed(1);
  const S = `stroke="${INK}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"`;
  const mirror = (s) => `<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
  const both = (s) => s + mirror(s);

  function egg(sp) {
    const p = PAL[sp] || PAL.shark;
    let mark = '';
    if (sp === 'shark') mark = `<path d="M52 122 Q64 112 76 122 T100 122 T124 122 T148 122 M50 150 Q62 140 74 150 T98 150 T122 150 T150 150" fill="none" stroke="${p.mark}" stroke-width="6" stroke-linecap="round"/>`;
    if (sp === 'turtle') mark = [[78, 104], [118, 98], [98, 134], [70, 150], [128, 146]].map(([x, y]) => `<path d="M${x - 9} ${y} l4.5 -8 h9 l4.5 8 l-4.5 8 h-9 Z" fill="${p.mark}"/>`).join('');
    if (sp === 'dino') mark = [[76, 96, 9], [120, 90, 6], [104, 128, 11], [68, 146, 7], [130, 150, 8]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${p.mark}"/>`).join('');
    if (sp === 'dragon') mark = [0, 1, 2].map((row) => [0, 1, 2, 3].map((i) => `<path d="M${62 + i * 22 + (row % 2) * 11} ${104 + row * 22} q11 14 22 0" fill="none" stroke="${p.mark}" stroke-width="5" stroke-linecap="round"/>`).join('')).join('');
    if (sp === 'fish') mark = [[80, 100, 9], [116, 116, 12], [86, 146, 7], [126, 154, 6]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${p.mark}" stroke-width="4.5"/>`).join('');
    if (sp === 'bird') mark = [[74, 108], [112, 100], [94, 136], [128, 140], [70, 152]].map(([x, y]) => `<path d="M${x - 8} ${y - 5} L${x} ${y + 4} L${x + 8} ${y - 5}" fill="none" stroke="${p.mark}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><g class="m-body"><g class="m-egg">`
      + `<path d="M100 44 C138 44 160 104 157 140 C154 172 131 189 100 189 C69 189 46 172 43 140 C40 104 62 44 100 44 Z" fill="${p.egg}" ${S}/>`
      + mark
      + `<ellipse cx="78" cy="78" rx="10" ry="16" fill="#FFFFFF" opacity=".7" transform="rotate(25 78 78)"/>`
      + `</g><g class="m-crack"><path d="M50 124 L66 112 L80 128 L96 110 L110 128 L126 112 L150 126" fill="none" ${S}/></g></g></svg>`;
  }

  function creature(sp, st) {
    const p = PAL[sp] || PAL.shark;
    const f = F[st] || 1;
    let back = '', front = '', pattern = '', extra = '';
    let feet = both(`<ellipse cx="76" cy="180" rx="14" ry="9" fill="${p.main}" ${S}/>`);

    if (sp === 'shark') {
      back += `<path d="M82 86 Q96 ${n(86 - 20 * f)} ${n(104 + 6 * f)} ${n(86 - 40 * f)} Q112 ${n(86 - 18 * f)} 122 88 Z" fill="${p.accent}" ${S}/>`;
      back += `<g class="m-wiggle"><path d="M150 146 L${n(150 + 34 * f)} ${n(146 - 26 * f)} Q${n(150 + 22 * f)} 146 ${n(150 + 34 * f)} ${n(146 + 22 * f)} Z" fill="${p.accent}" ${S}/></g>`;
      front += both(`<g class="m-wiggle"><path d="M50 138 Q${n(50 - 24 * f)} 148 ${n(50 - 14 * f)} ${n(156 + 6 * f)} Q52 156 57 150 Z" fill="${p.accent}" ${S}/></g>`);
      if (st >= 3) pattern += `<path d="M140 116 q5 7 0 14 M147 114 q5 8 0 17" fill="none" stroke="${p.accent}" stroke-width="3.5" stroke-linecap="round"/>`;
    }
    if (sp === 'turtle') {
      const rx = n(62 + 8 * f), ry = n(58 + 6 * f);
      back += `<ellipse cx="100" cy="126" rx="${rx}" ry="${ry}" fill="${p.accent}" ${S}/>`;
      back += [200, 232, 270, 308, 340].map((a) => {
        const r = (a * Math.PI) / 180;
        return `<circle cx="${n(100 + (rx - 6) * Math.cos(r))}" cy="${n(126 + (ry - 6) * Math.sin(r))}" r="4.5" fill="${p.rim}"/>`;
      }).join('');
      front += both(`<g class="m-wiggle"><ellipse cx="50" cy="150" rx="${n(13 * f)}" ry="8" fill="${p.main}" ${S} transform="rotate(-25 50 150)"/></g>`);
      if (st >= 3) pattern += both(`<path d="M68 101 q10 -7 20 -1" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>`);
    }
    if (sp === 'dino') {
      const cnt = [0, 3, 3, 4, 5][st];
      for (let i = 0; i < cnt; i++) {
        const a = ((-50 + (100 * i) / (cnt - 1)) * Math.PI) / 180;
        const pt = (ang, r) => `${n(100 + r * Math.sin(ang))} ${n(128 - r * Math.cos(ang))}`;
        back += `<path d="M${pt(a - 0.17, 50)} L${pt(a, 54 + 20 * f)} L${pt(a + 0.17, 50)} Z" fill="${p.accent}" ${S}/>`;
      }
      back += `<g class="m-wiggle"><path d="M146 156 Q${n(170 + 12 * f)} 160 ${n(178 + 10 * f)} ${n(132 - 6 * f)} Q166 150 144 140 Z" fill="${p.main}" ${S}/></g>`;
      front += both(`<ellipse cx="54" cy="148" rx="${n(9 * f)}" ry="7" fill="${p.main}" ${S}/>`);
      if (st >= 3) pattern += `<circle cx="66" cy="100" r="5" fill="${p.accent}" opacity=".55"/><circle cx="136" cy="96" r="4" fill="${p.accent}" opacity=".55"/><circle cx="142" cy="112" r="3" fill="${p.accent}" opacity=".55"/>`;
    }
    if (sp === 'dragon') {
      back += both(`<g class="m-wiggle"><path d="M56 112 Q${n(56 - 40 * f)} ${n(112 - 40 * f)} ${n(56 - 46 * f)} ${n(112 + 4 * f)} Q${n(56 - 32 * f)} ${n(112 - 2 * f)} ${n(56 - 26 * f)} ${n(112 + 16 * f)} Q${n(56 - 14 * f)} ${n(112 + 4 * f)} 58 134 Z" fill="${p.accent}" ${S}/></g>`);
      back += both(`<path d="M78 84 Q${n(70 - 4 * f)} ${n(84 - 24 * f)} ${n(72 - 6 * f)} ${n(84 - 30 * f)} Q84 ${n(84 - 16 * f)} 90 80 Z" fill="${p.horn}" ${S}/>`);
      back += `<g class="m-wiggle"><path d="M146 158 Q170 166 ${n(176 + 6 * f)} ${n(144 - 4 * f)} Q164 154 144 146 Z" fill="${p.main}" ${S}/><path d="M${n(176 + 6 * f)} ${n(134 - 4 * f)} l9 10 l-9 10 l-9 -10 Z" fill="${p.accent}" ${S}/></g>`;
      if (st >= 3) pattern += `<path d="M80 140 h40 M84 150 h32 M90 160 h20" stroke="${p.accent}" stroke-width="3" stroke-linecap="round" opacity=".55"/>`;
    }
    if (sp === 'fish') {
      feet = '';
      back += `<g class="m-wiggle"><path d="M148 128 L${n(150 + 38 * f)} ${n(128 - 30 * f)} Q${n(150 + 26 * f)} 128 ${n(150 + 38 * f)} ${n(128 + 30 * f)} Z" fill="${p.accent}" ${S}/></g>`;
      back += `<path d="M82 82 Q100 ${n(82 - 32 * f)} 120 84 Z" fill="${p.accent}" ${S}/>`;
      front += both(`<g class="m-wiggle"><ellipse cx="52" cy="152" rx="${n(12 * f)}" ry="7" fill="${p.accent}" ${S} transform="rotate(30 52 152)"/></g>`);
      if (st >= 3) pattern += `<path d="M70 96 q6 6 12 0 M88 90 q6 6 12 0 M106 90 q6 6 12 0 M124 96 q6 6 12 0" fill="none" stroke="${p.accent}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
      if (st >= 2) extra += `<circle cx="34" cy="70" r="6" fill="#FFFFFF" fill-opacity=".6" stroke="${INK}" stroke-width="3"/><circle cx="24" cy="92" r="4" fill="#FFFFFF" fill-opacity=".6" stroke="${INK}" stroke-width="3"/>`;
    }
    if (sp === 'bird') {
      feet = both(`<ellipse cx="80" cy="182" rx="11" ry="6" fill="${p.beak}" ${S}/>`);
      back += both(`<g class="m-wiggle"><path d="M52 118 Q${n(52 - 32 * f)} 130 ${n(52 - 18 * f)} ${n(156 + 4 * f)} Q48 150 60 146 Z" fill="${p.accent}" ${S}/></g>`);
      front += `<path d="M98 78 Q${n(88 - 4 * f)} ${n(78 - 24 * f)} 100 ${n(78 - 28 * f)} Q106 ${n(78 - 12 * f)} 98 78 Z" fill="${p.accent}" ${S}/>`;
      if (st >= 2) front += `<path d="M104 78 Q${n(112 + 4 * f)} ${n(78 - 18 * f)} ${n(118 + 4 * f)} ${n(78 - 14 * f)} Q112 76 104 78 Z" fill="${p.accent}" ${S}/>`;
    }

    const er = [0, 9.5, 9, 8.4, 8.2][st];
    const eyes = `<g class="m-eyes"><ellipse cx="80" cy="118" rx="${er}" ry="${n(er * 1.2)}" fill="${INK}"/><ellipse cx="120" cy="118" rx="${er}" ry="${n(er * 1.2)}" fill="${INK}"/>`
      + `<circle cx="83" cy="113" r="${n(er * .4)}" fill="#FFFFFF"/><circle cx="123" cy="113" r="${n(er * .4)}" fill="#FFFFFF"/></g>`;
    const happy = `<g class="m-happy-eyes">${both(`<path d="M71 121 Q80 109 89 121" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`)}</g>`;
    const cheeks = `<g class="m-cheeks">${both(`<ellipse cx="65" cy="136" rx="9" ry="5.5" fill="#FF8FA6" opacity=".6"/>`)}</g>`;
    let mouth;
    if (sp === 'bird') {
      mouth = `<g class="m-mouth-closed"><path d="M90 129 Q100 124 110 129 L100 142 Z" fill="${p.beak}" ${S}/></g>`
        + `<g class="m-mouth-open"><ellipse cx="100" cy="137" rx="8" ry="6" fill="#8C3B4A"/><path d="M89 128 Q100 122 111 128 L100 134 Z" fill="${p.beak}" ${S}/><path d="M92 140 L100 151 L108 140 Z" fill="${p.beak}" ${S}/></g>`;
    } else {
      const teeth = sp === 'shark' && st >= 2 ? `<path d="M93 132 l3 5 l3 -5 M101 132 l3 5 l3 -5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>` : '';
      mouth = `<g class="m-mouth-closed"><path d="M92 133 Q96 138 100 133 Q104 138 108 133" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>`
        + `<g class="m-mouth-open"><path d="M89 130 Q100 152 111 130 Z" fill="#8C3B4A" ${S}/><ellipse cx="100" cy="141" rx="5" ry="3.2" fill="#FF8FA6"/>${teeth}</g>`;
    }
    if (st >= 4) {
      extra += `<path d="M80 80 L83 58 L93 70 L100 52 L107 70 L117 58 L120 80 Z" fill="#FFD54A" ${S}/><circle cx="100" cy="72" r="4" fill="#FF6F8E"/>`;
      extra += [[28, 56], [170, 64], [176, 112]].map(([x, y]) => `<path d="M${x} ${y - 9} l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 Z" fill="#FFD54A"/>`).join('');
    }

    return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><g class="m-body">`
      + back + feet
      + `<ellipse cx="100" cy="128" rx="56" ry="54" fill="${p.main}" ${S}/>`
      + `<ellipse cx="100" cy="150" rx="34" ry="26" fill="${p.belly}"/>`
      + pattern + front + cheeks + eyes + happy + mouth + extra
      + `</g></svg>`;
  }

  window.PlaceholderArt = {
    svg(species, stage) {
      return stage <= 0 ? egg(species) : creature(species, Math.min(4, stage));
    },
  };
})();

</script>
<script>
/* まなモン：小道具・学期・保存・科目データ・モンスター表示 */
(function () {
  const MM = (window.MM = window.MM || {});

  // ---------- 小道具 ----------
  const u = (MM.u = {
    $: (s, r = document) => r.querySelector(s),
    $$: (s, r = document) => Array.from(r.querySelectorAll(s)),
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    uid: (p) => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    pad: (v) => String(v).padStart(2, '0'),
    ds: (d) => `${d.getFullYear()}-${u.pad(d.getMonth() + 1)}-${u.pad(d.getDate())}`,
    today: () => u.ds(new Date()),
    pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    addDays(s, k) { const d = u.pd(s); d.setDate(d.getDate() + k); return u.ds(d); },
    dow: (s) => u.pd(s).getDay(),
    DOW: ['日', '月', '火', '水', '木', '金', '土'],
    jp(s) { const d = u.pd(s); return `${d.getMonth() + 1}月${d.getDate()}日（${u.DOW[d.getDay()]}）`; },
    md(s) { const d = u.pd(s); return `${d.getMonth() + 1}/${d.getDate()}`; },
    daysBetween: (a, b) => Math.round((u.pd(b) - u.pd(a)) / 86400000),
    pick: (a) => a[Math.floor(Math.random() * a.length)],
    shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; },
    stars(v) { const k = Math.round(v); return `<span class="stars" aria-label="5段階の${k}">${'★'.repeat(k)}<span class="off">${'★'.repeat(5 - k)}</span></span>`; },
  });

  // ---------- 合図（画面の更新など） ----------
  const handlers = {};
  MM.on = (e, fn) => { (handlers[e] = handlers[e] || []).push(fn); };
  MM.emit = (e, d) => { (handlers[e] || []).forEach((fn) => { try { fn(d); } catch (err) { console.error(err); } }); };

  // ---------- 学期（第1学期 4〜9月 / 第2学期 10〜3月） ----------
  MM.sem = {
    ofDate(d) {
      d = d || new Date();
      const y = d.getFullYear(), m = d.getMonth() + 1;
      if (m >= 4 && m <= 9) return `${y}-1`;
      return m >= 10 ? `${y}-2` : `${y - 1}-2`;
    },
    idx(id) { const [y, t] = id.split('-').map(Number); return y * 2 + (t - 1); },
    shift(id, k) { const i = MM.sem.idx(id) + k; return `${Math.floor(i / 2)}-${(i % 2) + 1}`; },
    current() { return MM.sem.shift(MM.sem.ofDate(), (MM.state && MM.state.semShift) || 0); },
    cmp: (a, b) => MM.sem.idx(a) - MM.sem.idx(b),
    label(id) { const [y, t] = id.split('-'); return `${y}年度 第${t}学期`; },
    range(id) {
      const [y, t] = id.split('-').map(Number);
      return t === 1 ? { start: `${y}-04-01`, end: `${y}-09-30` } : { start: `${y}-10-01`, end: `${y + 1}-03-31` };
    },
  };

  // ---------- コース ----------
  MM.COURSES = [
    { id: 'shinri', name: '心理と教育' },
    { id: 'shakai', name: '社会と産業' },
    { id: 'ningen', name: '人間と文化' },
  ];
  MM.courseName = (id) => (MM.COURSES.find((c) => c.id === id) || { name: '未定' }).name;

  // ---------- 状態と保存 ----------
  MM.KEY = 'manamon.v1';
  MM.defaultState = () => ({
    v: 1, savedAt: 0, onboarded: false, demo: false,
    profile: { name: '', course: 'undecided', earnedBefore: 0, required: 124, sound: true, years: 5, startSem: '' },
    semShift: 0,
    room: { mode: 'normal', since: 0 },
    minutes: {},
    semesters: {},
    monsters: [], activeId: null,
    food: {},
    tt: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
    plans: {}, events: [],
    stats: { lessons: 0, foodEarned: 0, streak: 0, lastStudy: null },
    tip: 0, favTips: [],
  });
  function merge(s) {
    const d = MM.defaultState();
    if (!s || typeof s !== 'object') return d;
    const out = Object.assign(d, s, {
      profile: Object.assign(d.profile, s.profile || {}),
      stats: Object.assign(d.stats, s.stats || {}),
      tt: Object.assign(d.tt, s.tt || {}),
      room: Object.assign(d.room, s.room || {}),
    });
    if (!MM.COURSES.some((c) => c.id === out.profile.course)) out.profile.course = 'undecided';
    return out;
  }
  MM.merge = merge;

  MM.load = function () {
    let s = null;
    try { const raw = localStorage.getItem(MM.KEY); if (raw) s = JSON.parse(raw); } catch (e) { s = null; }
    MM.state = merge(s);
  };

  // claude.ai で開いたときはアカウントに保存（db 機能）。それ以外はこのブラウザだけに保存。
  const cloud = (MM.cloud = { ready: false, ref: null, failed: false });
  let writing = false, again = false, timer = null;
  async function cloudWrite() {
    if (!cloud.ready || !cloud.ref) return;
    if (writing) { again = true; return; }
    writing = true;
    try {
      await cloud.ref.set({ state: JSON.parse(JSON.stringify(MM.state)), savedAt: MM.state.savedAt });
    } catch (e) {
      const code = e && e.code;
      if (code === 'unavailable') { setTimeout(() => { again = true; }, 1500 + Math.random() * 1500); }
      else { cloud.ready = false; cloud.failed = true; MM.emit('cloud'); }
      console.warn('cloud save failed', e);
    }
    writing = false;
    if (again) { again = false; cloudWrite(); }
  }
  MM.save = function (now) {
    MM.state.savedAt = Date.now();
    clearTimeout(timer);
    const run = () => {
      try { localStorage.setItem(MM.KEY, JSON.stringify(MM.state)); } catch (e) { /* 保存できない環境 */ }
      cloudWrite();
    };
    if (now) run(); else timer = setTimeout(run, 500);
  };
  MM.initCloud = async function () {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/state');
      const snap = await ref.get();
      cloud.ref = ref;
      cloud.ready = true;
      const remote = snap.exists ? (snap.data() || {}).state : null;
      if (remote && (remote.savedAt || 0) > (MM.state.savedAt || 0)) {
        MM.state = merge(remote);
        try { localStorage.setItem(MM.KEY, JSON.stringify(MM.state)); } catch (e) { /* noop */ }
        MM.emit('replaced');
      }
      MM.emit('cloud');
    } catch (e) {
      console.warn('cloud unavailable', e);
    }
  };

  // ---------- 科目データ（js/data_subjects.js） ----------
  const DATA = (MM.DATA = window.OUJ_DATA || { subjects: [], events: [], requirements: null, sources: [] });
  MM.catalog = {
    all: DATA.subjects || [],
    byId(id) { return MM.catalog.all.find((s) => s.id === id) || null; },
    isCommon: (s) => (s.courses || []).includes('共通'),
  };

  // ---------- モンスターの絵 ----------
  const SPECIES = window.MONSTER_SPECIES || [];
  const LABELS = window.MONSTER_STAGE_LABELS || ['たまご', 'ベビー', 'こども', 'おとな', 'きわみ'];
  MM.art = {
    species: (id) => SPECIES.find((s) => s.id === id) || SPECIES[0],
    allSpecies: () => SPECIES,
    stageLabel: (st) => LABELS[st] || '',
    formName(sp, st) { const s = MM.art.species(sp); return (s && s.names && s.names[st]) || LABELS[st]; },
    desc(sp, st) { const s = MM.art.species(sp); return (s && s.desc && s.desc[st]) || ''; },
    markup(sp, st) {
      const set = (window.MONSTER_ART || {})[sp];
      const v = set ? (st <= 0 ? set.egg : set[st]) : null;
      if (typeof v === 'string' && v.trim().startsWith('<svg')) return v;
      if (v && typeof v === 'object' && v.svg) return v.svg;
      if (v && typeof v === 'object' && v.img) return `<img src="${u.esc(v.img)}" alt="">`;
      return window.PlaceholderArt ? window.PlaceholderArt.svg(sp, st) : '';
    },
    html(m, opt) {
      opt = opt || {};
      const sp = m.species, st = m.stage || 0;
      const meta = MM.art.species(sp) || {};
      const cls = ['mon', st === 0 ? 'is-egg' : '', meta.floaty && st > 0 ? 'floaty' : '', opt.cls || ''].join(' ').trim();
      const data = m.id ? ` data-mid="${u.esc(m.id)}"` : '';
      return `<div class="${cls}" style="--size:${opt.size || 150}px"${data}><div class="mon-flip"><div class="mon-bob">${MM.art.markup(sp, st)}</div></div></div>`;
    },
  };
})();

</script>
<script>
/* まなモン：育成と勉強の記録（えさ・ふ化・進化・単位・予定） */
(function () {
  const MM = window.MM, u = MM.u;

  MM.FOODS = [
    { id: 'onigiri', name: 'おにぎり', emoji: '🍙', rarity: 0, hunger: 22, aff: 1 },
    { id: 'apple', name: 'りんご', emoji: '🍎', rarity: 0, hunger: 18, aff: 1 },
    { id: 'fish', name: 'おさかな', emoji: '🐟', rarity: 0, hunger: 24, aff: 1 },
    { id: 'carrot', name: 'にんじん', emoji: '🥕', rarity: 0, hunger: 16, aff: 1 },
    { id: 'meat', name: 'おにく', emoji: '🍖', rarity: 0, hunger: 26, aff: 1 },
    { id: 'strawberry', name: 'いちご', emoji: '🍓', rarity: 1, hunger: 20, aff: 3 },
    { id: 'cake', name: 'ケーキ', emoji: '🍰', rarity: 1, hunger: 30, aff: 3 },
    { id: 'star', name: 'ほしのかけら', emoji: '🌟', rarity: 2, hunger: 40, aff: 8 },
  ];
  MM.foodDef = (id) => MM.FOODS.find((f) => f.id === id);
  MM.foodTotal = () => Object.values(MM.state.food).reduce((a, b) => a + (b || 0), 0);

  const HUNGER_PER_H = 2.2, MOOD_PER_H = 1.1, H = 3600000;
  const COLORS = ['#15A086', '#FF8A3D', '#4C7DF0', '#E85D9E', '#9B6BEF', '#D9A400', '#2BB3C0', '#E2574C', '#6BA539', '#A1887F'];
  const TYPE_LESSONS = { broadcast: 15, face: 8, online: 8, live: 8, other: 15 };
  MM.TYPE_LABEL = { broadcast: '放送授業', face: '面接授業', online: 'オンライン授業', live: 'ライブWeb授業', other: 'その他' };

  const G = (MM.game = {
    HATCH_AT: 3,
    active() { return MM.state.monsters.find((m) => m.id === MM.state.activeId) || null; },
    team() { return MM.state.monsters.filter((m) => m.frozen); },
    semData(id) {
      id = id || MM.sem.current();
      const all = MM.state.semesters;
      if (!all[id]) all[id] = { subjects: [] };
      return all[id];
    },
    subjects(id) { return G.semData(id).subjects; },
    findSubject(uid) {
      for (const sd of Object.values(MM.state.semesters)) {
        const s = sd.subjects.find((x) => x.uid === uid);
        if (s) return s;
      }
      return null;
    },

    // ----- おなか・ごきげん（時間で少しずつ減る。0 になっても いなくならない） -----
    vitals(m) {
      if (!m) return { hunger: 0, mood: 0 };
      if (m.frozen || m.stage === 0) return { hunger: m.hunger, mood: m.mood };
      const dt = Math.max(0, Date.now() - (m.tick || Date.now()));
      return { hunger: u.clamp(m.hunger - (dt / H) * HUNGER_PER_H, 0, 100), mood: u.clamp(m.mood - (dt / H) * MOOD_PER_H, 0, 100) };
    },
    commit(m) { const v = G.vitals(m); m.hunger = v.hunger; m.mood = v.mood; m.tick = Date.now(); },
    level: (m) => 1 + Math.floor((m.aff || 0) / 10),

    // ----- えさ -----
    dropFood(minRarity) {
      const r = Math.random();
      let rarity = r < 0.03 ? 2 : r < 0.2 ? 1 : 0;
      if (minRarity && rarity < minRarity) rarity = minRarity;
      const f = u.pick(MM.FOODS.filter((x) => x.rarity === rarity));
      MM.state.food[f.id] = (MM.state.food[f.id] || 0) + 1;
      MM.state.stats.foodEarned += 1;
      return f;
    },

    // ----- 授業を1回やった -----
    completeLesson(uid, opt) {
      const s = G.findSubject(uid);
      if (!s) return null;
      if (s.done >= s.total) return { s, full: true };
      s.done += 1;
      const st = MM.state.stats, today = u.today();
      st.lessons += 1;
      if (st.lastStudy !== today) { st.streak = st.lastStudy === u.addDays(today, -1) ? st.streak + 1 : 1; st.lastStudy = today; }
      if (!(opt && opt.fromPlan)) {
        const arr = (MM.state.plans[today] = MM.state.plans[today] || []);
        const p = arr.find((x) => x.uid === uid);
        if (p && !p.done && !p.skip) { p.done = true; p.rewarded = true; }
        else if (!p && (MM.state.tt[u.dow(today)] || []).includes(uid)) arr.push({ id: u.uid('p'), uid, done: true, rewarded: true });
      }
      const res = { s, food: G.dropFood(), allDone: s.done >= s.total };
      const m = G.active();
      if (m && m.stage === 0) { m.warmth = (m.warmth || 0) + 1; res.hatchReady = m.warmth >= G.HATCH_AT; }
      MM.save();
      return res;
    },
    undoLesson(uid) { const s = G.findSubject(uid); if (!s || s.done <= 0) return false; s.done -= 1; MM.save(); return true; },
    toggleTsushin(uid) {
      const s = G.findSubject(uid);
      if (!s) return null;
      s.tsushin = !s.tsushin;
      const foods = [];
      if (s.tsushin && !s.tsushinRewarded) { s.tsushinRewarded = true; foods.push(G.dropFood(1), G.dropFood(), G.dropFood()); }
      MM.save();
      return { on: s.tsushin, foods };
    },

    // ----- 単位GET（合格） → 進化 -----
    pass(uid) {
      const s = G.findSubject(uid);
      if (!s || s.passed) return null;
      s.passed = true; s.passedAt = u.today();
      const res = { s, foods: [G.dropFood(1), G.dropFood(), G.dropFood()] };
      const m = G.active();
      if (m) {
        m.credits = (m.credits || 0) + s.credits;
        if (m.stage === 0) { m.pendingEvo = (m.pendingEvo || 0) + 1; res.pending = true; }
        else if (m.stage < 4) { res.from = m.stage; m.stage += 1; res.to = m.stage; res.evolved = true; m.evolvedAt = Date.now(); }
        else res.maxed = true;
      }
      MM.save();
      return res;
    },
    unpass(uid) {
      const s = G.findSubject(uid);
      if (!s || !s.passed) return false;
      s.passed = false;
      const m = G.active();
      if (m) { m.credits = Math.max(0, (m.credits || 0) - s.credits); if (m.stage > 1) m.stage -= 1; }
      MM.save();
      return true;
    },
    evolveOnce() {
      const m = G.active();
      if (!m || m.stage < 1 || m.stage >= 4) return null;
      const from = m.stage; m.stage += 1; m.evolvedAt = Date.now(); MM.save();
      return { from, to: m.stage };
    },

    // ----- ふ化・お世話 -----
    hatch(name) {
      const m = G.active();
      if (!m || m.stage !== 0) return null;
      m.stage = 1; m.hatchedAt = Date.now(); m.tick = Date.now(); m.hunger = 70; m.mood = 90;
      m.name = (name || '').trim() || MM.art.formName(m.species, 1);
      const pend = Math.min(3, m.pendingEvo || 0); m.pendingEvo = 0;
      MM.save();
      return { m, pend };
    },
    feed(foodId) {
      const m = G.active();
      if (!m) return { none: true };
      if (m.stage === 0) return { egg: true };
      if (!(MM.state.food[foodId] > 0)) return { none: true };
      G.commit(m);
      if (m.hunger >= 96) return { full: true };
      const f = MM.foodDef(foodId), lv = G.level(m);
      const fav = (MM.art.species(m.species) || {}).favorite === foodId;
      MM.state.food[foodId] -= 1;
      m.hunger = u.clamp(m.hunger + f.hunger, 0, 100);
      m.mood = u.clamp(m.mood + 6 + (fav ? 10 : 0), 0, 100);
      m.aff = (m.aff || 0) + f.aff + (fav ? 2 : 0);
      m.fed = (m.fed || 0) + 1;
      MM.save();
      return { ok: true, f, fav, levelUp: G.level(m) > lv ? G.level(m) : 0 };
    },
    pet() {
      const m = G.active();
      if (!m) return null;
      if (m.stage === 0) return { egg: true };
      G.commit(m);
      const today = u.today();
      if (m.petDay !== today) { m.petDay = today; m.petCount = 0; }
      m.petCount += 1;
      m.mood = u.clamp(m.mood + 7, 0, 100);
      if (m.petCount <= 5) m.aff = (m.aff || 0) + 0.4;
      MM.save();
      return { ok: true };
    },
    care(kind) {
      const m = G.active();
      if (!m) return null;
      if (m.stage === 0) return { egg: true };
      G.commit(m);
      const key = 'care_' + kind, now = Date.now();
      const cool = now - (m[key] || 0) < 45 * 60000;
      m.mood = u.clamp(m.mood + (cool ? 4 : 18), 0, 100);
      if (!cool) { m.aff = (m.aff || 0) + 1.5; m[key] = now; }
      MM.save();
      return { ok: true, cool };
    },

    // ----- たまご・学期の切りかえ -----
    eggChoices() {
      const all = MM.art.allSpecies().map((s) => s.id);
      const owned = new Set(MM.state.monsters.map((m) => m.species));
      return [...u.shuffle(all.filter((x) => !owned.has(x))), ...u.shuffle(all.filter((x) => owned.has(x)))].slice(0, 3);
    },
    newEgg(species) {
      const m = { id: u.uid('m'), species, name: '', sem: MM.sem.current(), stage: 0, warmth: 0, hunger: 80, mood: 80, aff: 0, credits: 0, tick: Date.now(), frozen: false, born: Date.now() };
      MM.state.monsters.push(m);
      MM.state.activeId = m.id;
      MM.save();
      return m;
    },
    transition() {
      const m = G.active(), cur = MM.sem.current();
      if (m && MM.sem.cmp(m.sem, cur) < 0) return { from: m.sem, to: cur, m };
      if (!m && MM.state.onboarded) return { from: null, to: cur, m: null };
      return null;
    },
    freeze(m) { G.commit(m); m.frozen = true; m.frozenAt = Date.now(); MM.state.activeId = null; MM.save(); },
    leftovers(semId) { return (MM.state.semesters[semId] || { subjects: [] }).subjects.filter((s) => !s.passed); },
    carryOver(subjs) {
      const sd = G.semData(), map = {};
      subjs.forEach((s) => {
        if (sd.subjects.some((x) => x.name === s.name)) return;
        const n = Object.assign({}, s, { uid: u.uid('s'), sem: MM.sem.current(), carried: true, color: COLORS[sd.subjects.length % COLORS.length] });
        map[s.uid] = n.uid;
        sd.subjects.push(n);
      });
      G.cleanTT(map);
    },
    // 時間割を今学期の科目だけにする（引きついだ科目は新しい記録へつけかえる）
    cleanTT(map) {
      const cur = new Set(G.subjects().map((s) => s.uid));
      for (const k of Object.keys(MM.state.tt)) {
        MM.state.tt[k] = (MM.state.tt[k] || []).map((id) => (map && map[id]) || id).filter((id) => cur.has(id));
      }
      MM.save();
    },

    // ----- 科目の登録 -----
    isRegistered(catId) { return G.subjects().some((s) => s.catId === catId); },
    register(c) {
      const sd = G.semData();
      if (sd.subjects.some((s) => s.catId === c.id)) return null;
      const s = {
        uid: u.uid('s'), catId: c.id, name: c.name, credits: c.credits || 2, type: 'broadcast', media: c.media || '',
        cat: c.cat || '', course: c.home || (c.courses || [])[0] || '共通', courses: (c.courses || []).slice(), total: TYPE_LESSONS.broadcast, done: 0,
        tsushin: false, passed: false, color: COLORS[sd.subjects.length % COLORS.length], sem: MM.sem.current(), added: Date.now(),
      };
      sd.subjects.push(s);
      MM.save();
      return s;
    },
    addCustom(o) {
      const sd = G.semData();
      const type = o.type || 'other';
      const s = {
        uid: u.uid('s'), catId: null, name: o.name, credits: Number(o.credits) || 1, type, media: '', cat: o.cat || '',
        course: o.course || '', courses: o.courses || (o.course ? [o.course] : []), total: Number(o.total) || TYPE_LESSONS[type] || 15, done: 0, tsushin: false, passed: false,
        color: COLORS[sd.subjects.length % COLORS.length], sem: MM.sem.current(), added: Date.now(), custom: true,
      };
      sd.subjects.push(s);
      MM.save();
      return s;
    },
    lessonsFor: (type, credits) => (type === 'online' && Number(credits) >= 2 ? 15 : TYPE_LESSONS[type] || 15),
    removeSubject(uid) {
      for (const sd of Object.values(MM.state.semesters)) sd.subjects = sd.subjects.filter((s) => s.uid !== uid);
      for (const k of Object.keys(MM.state.tt)) MM.state.tt[k] = (MM.state.tt[k] || []).filter((x) => x !== uid);
      for (const k of Object.keys(MM.state.plans)) MM.state.plans[k] = MM.state.plans[k].filter((p) => p.uid !== uid);
      MM.save();
    },

    // ----- 単位の計算 -----
    credits() {
      const p = MM.state.profile;
      let earned = 0;
      for (const sd of Object.values(MM.state.semesters)) for (const s of sd.subjects) if (s.passed) earned += s.credits;
      const cur = G.subjects();
      const semReg = cur.reduce((a, s) => a + s.credits, 0);
      const semEarned = cur.filter((s) => s.passed).reduce((a, s) => a + s.credits, 0);
      const required = Number(p.required) || 124;
      const total = (Number(p.earnedBefore) || 0) + earned;
      return { earned, total, required, remain: Math.max(0, required - total), semReg, semEarned, semRemain: semReg - semEarned };
    },
    passedAll() { const out = []; for (const sd of Object.values(MM.state.semesters)) sd.subjects.forEach((s) => s.passed && out.push(s)); return out; },

    // ----- 予定（カレンダー） -----
    dayItems(date) {
      const ex = MM.state.plans[date] || [];
      const items = ex.filter((p) => !p.skip).map((p) => Object.assign({}, p, { subj: G.findSubject(p.uid) })).filter((p) => p.subj);
      if (date >= MM.sem.range(MM.sem.ofDate()).start) {
        const cur = G.subjects();
        (MM.state.tt[u.dow(date)] || []).forEach((uid) => {
          if (ex.some((p) => p.uid === uid)) return;
          const s = cur.find((x) => x.uid === uid);
          if (s && !s.passed) items.push({ uid, done: false, tt: true, subj: s });
        });
      }
      return items;
    },
    addPlan(date, uid) {
      const arr = (MM.state.plans[date] = MM.state.plans[date] || []);
      const p = arr.find((x) => x.uid === uid);
      if (p) { if (!p.skip) return false; p.skip = false; } else arr.push({ id: u.uid('p'), uid, done: false });
      MM.save();
      return true;
    },
    removePlan(date, uid) {
      const arr = (MM.state.plans[date] = MM.state.plans[date] || []);
      const p = arr.find((x) => x.uid === uid);
      const inTT = (MM.state.tt[u.dow(date)] || []).includes(uid);
      if (p) { if (inTT || p.rewarded) { p.skip = true; } else arr.splice(arr.indexOf(p), 1); }
      else if (inTT) arr.push({ id: u.uid('p'), uid, skip: true });
      MM.save();
    },
    togglePlanDone(date, uid) {
      const arr = (MM.state.plans[date] = MM.state.plans[date] || []);
      let p = arr.find((x) => x.uid === uid);
      if (!p) { p = { id: u.uid('p'), uid, done: false }; arr.push(p); }
      p.skip = false;
      p.done = !p.done;
      let res = null;
      if (p.done && !p.rewarded) { p.rewarded = true; res = G.completeLesson(uid, { fromPlan: true }); }
      else MM.save();
      return { done: p.done, res };
    },
    eventsOn(date) { return MM.state.events.filter((e) => date >= e.date && date <= (e.end || e.date)); },
    officialOn(date) { return (MM.DATA.events || []).filter((e) => e.cal !== false && date >= e.start && date <= (e.end || e.start)); },
    addEvent(ev) { ev.id = u.uid('e'); MM.state.events.push(ev); MM.save(); return ev; },
    removeEvent(id) { MM.state.events = MM.state.events.filter((e) => e.id !== id); MM.save(); },
    toggleTT(dow, uid) {
      const arr = (MM.state.tt[dow] = MM.state.tt[dow] || []);
      const i = arr.indexOf(uid);
      if (i >= 0) arr.splice(i, 1); else arr.push(uid);
      MM.save();
      return i < 0;
    },

    // ----- ふきだしのセリフ -----
    speech() {
      const m = G.active();
      if (!m) return '';
      if (m.stage === 0) {
        const left = Math.max(0, G.HATCH_AT - (m.warmth || 0));
        return left > 0 ? `あと ${left}回 べんきょうすると うまれそう…！` : 'もうすぐ うまれるよ！';
      }
      const v = G.vitals(m), lines = [];
      if (v.hunger < 30) lines.push('おなか すいたよ〜', 'べんきょうして ごはん ちょうだい！');
      if (v.mood < 30) lines.push('なでて〜', 'あそんで ほしいな');
      const subs = G.subjects().filter((s) => !s.passed && s.done < s.total);
      if (subs.length) { const s = u.pick(subs); lines.push(`「${s.name.replace(/（.*?）$/, '')}」の つづき やろう？`); }
      const ex = (MM.DATA.events || []).find((e) => e.key === 'exam' && e.start >= u.today());
      if (ex) { const d = u.daysBetween(u.today(), ex.start); if (d <= 60) lines.push(`しけんまで あと ${d}日！`); }
      if (MM.state.stats.streak >= 2) lines.push(`${MM.state.stats.streak}日 れんぞく べんきょう中！すごい！`);
      lines.push('きょうも いっしょに がんばろ！', 'ちょっとずつで だいじょうぶ', 'たんいが ふえると しんかできるよ');
      return u.pick(lines);
    },
  });
})();

</script>
<script>
/* まなモン：音・演出・トースト・モーダル */
(function () {
  const MM = window.MM, u = MM.u;

  // ---------- 音（ファイルなし。ブラウザの中で合成） ----------
  const sfx = (MM.sfx = {
    ctx: null,
    ac() {
      if (!sfx.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; sfx.ctx = new C(); }
      if (sfx.ctx.state === 'suspended') sfx.ctx.resume();
      return sfx.ctx;
    },
    tone(freq, t0, dur, type, vol, slide) {
      const ac = sfx.ac(); if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.05);
    },
    noise(t0, dur, vol, freq) {
      const ac = sfx.ac(); if (!ac) return;
      const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + t0;
      src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq || 1000; g.gain.value = vol || 0.2;
      src.connect(f).connect(g).connect(ac.destination); src.start(t);
    },
    play(name) {
      if (!MM.state || !MM.state.profile.sound) return;
      try { const fn = sfx.lib[name]; if (fn) fn(); } catch (e) { /* 音が出ない環境 */ }
    },
    lib: {
      tap: () => sfx.tone(880, 0, 0.06, 'triangle', 0.07),
      get: () => { [784, 988, 1175, 1568].forEach((f, i) => sfx.tone(f, i * 0.07, 0.22, 'triangle', 0.15)); sfx.tone(2093, 0.3, 0.4, 'sine', 0.07); },
      rare: () => { [1047, 1319, 1568, 2093, 2637, 3136].forEach((f, i) => sfx.tone(f, i * 0.06, 0.32, 'sine', 0.12)); },
      eat: () => { [0, 0.17, 0.34].forEach((t) => { sfx.noise(t, 0.07, 0.25, 900); sfx.tone(240, t, 0.07, 'square', 0.04, 150); }); },
      pet: () => { sfx.tone(523, 0, 0.18, 'sine', 0.11, 784); sfx.tone(784, 0.12, 0.24, 'sine', 0.09, 1047); },
      bath: () => { for (let i = 0; i < 8; i++) sfx.tone(600 + Math.random() * 900, i * 0.07, 0.09, 'sine', 0.07, 1500); },
      jump: () => { sfx.tone(330, 0, 0.25, 'square', 0.06, 990); sfx.tone(660, 0.26, 0.16, 'triangle', 0.08); },
      no: () => { sfx.tone(300, 0, 0.12, 'square', 0.05, 220); sfx.tone(220, 0.13, 0.16, 'square', 0.05, 180); },
      level: () => { [659, 784, 1047, 1319].forEach((f, i) => sfx.tone(f, i * 0.09, 0.25, 'square', 0.05)); },
      pass: () => { [523, 659, 784, 1047].forEach((f, i) => sfx.tone(f, i * 0.12, 0.22, 'square', 0.06)); [523, 659, 784].forEach((f) => sfx.tone(f * 2, 0.5, 0.8, 'triangle', 0.06)); },
      evolve: () => {
        [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => sfx.tone(f, i * 0.11, 0.2, 'square', 0.06));
        [1047, 1319, 1568].forEach((f) => sfx.tone(f, 0.85, 1.0, 'triangle', 0.07));
      },
      hatch: () => { sfx.noise(0, 0.12, 0.3, 2000); sfx.noise(0.22, 0.12, 0.3, 2600); [784, 988, 1319, 1568].forEach((f, i) => sfx.tone(f, 0.45 + i * 0.08, 0.3, 'triangle', 0.11)); },
      wobble: () => { sfx.tone(392, 0, 0.1, 'sine', 0.08, 330); sfx.tone(330, 0.1, 0.1, 'sine', 0.08, 392); },
    },
  });
  MM.buzz = (p) => { try { if (MM.state.profile.sound && navigator.vibrate) navigator.vibrate(p); } catch (e) { /* noop */ } };

  // ---------- 演出 ----------
  const layer = () => u.$('#fx');
  const center = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const quiet = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  MM.fx = {
    center,
    burst(x, y, opt) {
      opt = opt || {};
      const L = layer(); if (!L || quiet()) return;
      const n = opt.count || 12, em = opt.emojis || ['✨'];
      for (let i = 0; i < n; i++) {
        const el = document.createElement('span');
        el.className = 'fx-p';
        el.textContent = u.pick(em);
        el.style.fontSize = (opt.size || 20) * (0.7 + Math.random() * 0.6) + 'px';
        L.appendChild(el);
        const a = Math.random() * Math.PI * 2, d = (opt.dist || 90) * (0.5 + Math.random() * 0.7);
        const dx = Math.cos(a) * d, dy = Math.sin(a) * d - (opt.up == null ? 30 : opt.up);
        el.animate([
          { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.3)`, opacity: 1 },
          { transform: `translate(${x + dx}px,${y + dy}px) translate(-50%,-50%) scale(1)`, opacity: 1, offset: 0.6 },
          { transform: `translate(${x + dx * 1.1}px,${y + dy + 40}px) translate(-50%,-50%) scale(.7)`, opacity: 0 },
        ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => el.remove();
      }
    },
    confetti(count) {
      const L = layer(); if (!L || quiet()) return;
      const cols = ['#FFC23E', '#FF6F63', '#15A086', '#4C7DF0', '#E85D9E', '#9B6BEF'];
      const W = window.innerWidth;
      for (let i = 0; i < (count || 70); i++) {
        const el = document.createElement('span');
        el.className = 'fx-p';
        el.style.cssText = `width:${6 + Math.random() * 6}px;height:${10 + Math.random() * 8}px;background:${u.pick(cols)};border-radius:2px`;
        L.appendChild(el);
        const x = Math.random() * W, drift = (Math.random() - 0.5) * 160, rot = (Math.random() - 0.5) * 1080;
        el.animate([
          { transform: `translate(${x}px,-30px) rotate(0deg)`, opacity: 1 },
          { transform: `translate(${x + drift}px,${window.innerHeight * 0.9}px) rotate(${rot}deg)`, opacity: 0.9 },
        ], { duration: 1600 + Math.random() * 1200, delay: Math.random() * 300, easing: 'cubic-bezier(.25,.6,.4,1)' }).onfinish = () => el.remove();
      }
    },
    flyTo(fromEl, toEl, emoji, size) {
      return new Promise((resolve) => {
        const L = layer();
        if (!L || !fromEl || !toEl || quiet()) { resolve(); return; }
        const a = fromEl.nodeType ? center(fromEl) : fromEl, b = toEl.nodeType ? center(toEl) : toEl;
        const el = document.createElement('span');
        el.className = 'fx-p';
        el.textContent = emoji;
        el.style.fontSize = (size || 34) + 'px';
        L.appendChild(el);
        const mx = (a.x + b.x) / 2 + (Math.random() - 0.5) * 60, my = Math.min(a.y, b.y) - 90;
        let finished = false;
        const done = () => {
          if (finished) return;
          finished = true;
          el.remove();
          if (toEl.classList && toEl.classList.contains('food-pill')) toEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 300 });
          resolve();
        };
        el.animate([
          { transform: `translate(${a.x}px,${a.y}px) translate(-50%,-50%) scale(.4)` },
          { transform: `translate(${a.x}px,${a.y - 40}px) translate(-50%,-50%) scale(1.5)`, offset: 0.25 },
          { transform: `translate(${mx}px,${my}px) translate(-50%,-50%) scale(1.1)`, offset: 0.6 },
          { transform: `translate(${b.x}px,${b.y}px) translate(-50%,-50%) scale(.6)` },
        ], { duration: 950, easing: 'cubic-bezier(.4,0,.3,1)' }).onfinish = done;
        setTimeout(done, 1300); // 画面が隠れていてアニメが止まっても先へ進む
      });
    },
    floatText(x, y, text) {
      const L = layer(); if (!L) return;
      const el = document.createElement('span');
      el.className = 'fx-text';
      el.textContent = text;
      L.appendChild(el);
      el.animate([
        { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.5)`, opacity: 0 },
        { transform: `translate(${x}px,${y - 30}px) translate(-50%,-50%) scale(1.15)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${x}px,${y - 70}px) translate(-50%,-50%) scale(1)`, opacity: 0 },
      ], { duration: 1500, easing: 'ease-out' }).onfinish = () => el.remove();
    },
    hearts(el, emojis) { if (!el) return; const c = center(el); MM.fx.burst(c.x, c.y - 30, { emojis: emojis || ['💗', '💕', '💖'], count: 8, dist: 70, up: 60, size: 22 }); },
    flash() { const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 800); },
    mood(el, cls, ms) { if (!el) return; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms || 1500); },
  };

  // まばたき
  setInterval(() => {
    u.$$('.mon:not(.is-egg)').forEach((el) => {
      if (Math.random() < 0.35) { el.classList.add('blink'); setTimeout(() => el.classList.remove('blink'), 140); }
    });
  }, 2300);

  // ---------- トースト ----------
  MM.toast = (html, opt) => {
    opt = opt || {};
    const root = u.$('#toast-root'); if (!root) return;
    const t = document.createElement('div');
    t.className = 'toast' + (opt.big ? ' big' : '');
    t.innerHTML = html;
    root.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, opt.ms || 2200);
  };

  // ---------- モーダル・シート（alert/confirm は使わない） ----------
  MM.ui = {
    open(html, opt) {
      opt = opt || {};
      const root = u.$('#overlay-root');
      const ov = document.createElement('div');
      ov.className = 'overlay' + (opt.center ? ' center' : '');
      ov.innerHTML = `<div class="${opt.center ? 'modal' : 'sheet'}" role="dialog" aria-modal="true">${html}</div>`;
      ov._opt = opt;
      ov.addEventListener('click', (e) => { if (e.target === ov && !opt.locked) MM.ui.close(ov); });
      root.appendChild(ov);
      const f = ov.querySelector('[autofocus]');
      if (f) setTimeout(() => f.focus(), 50);
      return ov;
    },
    close(ov) {
      ov = ov || MM.ui.top();
      if (!ov || !ov.parentNode) return;
      ov.remove();
      if (ov._opt && ov._opt.onClose) ov._opt.onClose();
    },
    top() { const all = u.$$('#overlay-root > .overlay'); return all[all.length - 1] || null; },
    confirm(msg, ok, danger) {
      return new Promise((resolve) => {
        const ov = MM.ui.open(`<h3>かくにん</h3><p>${msg}</p><div class="modal-actions"><button class="btn" data-x="no">やめる</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-x="yes">${ok || 'OK'}</button></div>`, { center: true, onClose: () => resolve(false) });
        ov.querySelector('[data-x="no"]').onclick = () => MM.ui.close(ov);
        ov.querySelector('[data-x="yes"]').onclick = () => { ov._opt.onClose = null; MM.ui.close(ov); resolve(true); };
      });
    },
  };
})();

</script>
<script>
/* まなモン：はじめての設定・たまご選び・ふ化・進化・学期の切りかえ */
(function () {
  const MM = window.MM, u = MM.u, G = MM.game;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function courseOptions(sel) {
    return [{ id: 'undecided', name: '未定（あとで決める）' }].concat(MM.COURSES)
      .map((c) => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${c.name}${c.id === 'undecided' ? '' : 'コース'}</option>`).join('');
  }
  MM.courseOptions = courseOptions;

  const F = (MM.flow = {
    // ---------- はじめて ----------
    onboarding() {
      const sp = u.pick(MM.art.allSpecies()).id;
      const ov = MM.ui.open(`
        <h3>まなモンへ ようこそ</h3>
        ${MM.art.html({ species: sp, stage: 0 }, { size: 120 })}
        <p>放送大学の勉強を記録すると えさ がもらえて、モンスターが育ちます。</p>
        <div class="stack" style="text-align:left;font-size:13.5px;margin:10px 4px">
          <div>🥚 1学期に1ぴき、たまごから育てます</div>
          <div>📺 授業を1回やるごとに えさ をゲット</div>
          <div>🎓 単位をとるたびに しんか</div>
          <div>🤝 学期がおわると チームの なかまに</div>
        </div>
        <p class="note">個人用の非公式アプリです。放送大学の公式アプリではありません。日程や制度は放送大学の公式サイトで確認してください。</p>
        <div class="modal-actions"><button class="btn btn-primary" data-x="start">はじめる</button><button class="btn" data-x="demo">おためしデータで見る</button></div>`, { center: true, locked: true });
      ov.querySelector('[data-x="start"]').onclick = () => { MM.ui.close(ov); F.profile(); };
      ov.querySelector('[data-x="demo"]').onclick = () => { MM.ui.close(ov); MM.demo.load(); };
    },
    profile() {
      const p = MM.state.profile;
      const ov = MM.ui.open(`
        <h3>あなたのこと</h3>
        <div class="stack" style="text-align:left">
          <div class="field"><label for="obName">よびかた（なくてもOK）</label><input class="input" id="obName" maxlength="20" value="${u.esc(p.name)}" placeholder="例：まなぶさん"></div>
          <div class="field"><label for="obCourse">所属コース（文系寄りの4コース）</label><select class="input" id="obCourse">${courseOptions(p.course)}</select></div>
          <div class="grid-2">
            <div class="field"><label for="obBefore">いままでに とった単位</label><input class="input num" id="obBefore" type="number" min="0" max="200" inputmode="numeric" value="${p.earnedBefore}"></div>
            <div class="field"><label for="obReq">卒業に必要な単位</label><input class="input num" id="obReq" type="number" min="1" max="200" inputmode="numeric" value="${p.required}"></div>
          </div>
          <p class="note">卒業には124単位以上が必要です（1年次入学）。編入学などで違う人は書きかえてください。あとから「設定」で変えられます。</p>
        </div>
        <div class="modal-actions"><button class="btn btn-primary" data-x="next">つぎへ</button></div>`, { center: true, locked: true });
      ov.querySelector('[data-x="next"]').onclick = () => {
        p.name = u.$('#obName').value.trim();
        p.course = u.$('#obCourse').value;
        p.earnedBefore = Math.max(0, Number(u.$('#obBefore').value) || 0);
        p.required = Math.max(1, Number(u.$('#obReq').value) || 124);
        MM.ui.close(ov);
        F.chooseEgg('さいしょの たまごを えらんでね', () => {
          MM.state.onboarded = true;
          MM.save(true);
          MM.go('home');
          MM.toast('たまごを あたためよう！授業を3回やると うまれるよ', { ms: 3200 });
        });
      };
    },

    // ---------- たまご選び ----------
    chooseEgg(title, done) {
      const choices = G.eggChoices();
      let pick = choices[0];
      const ov = MM.ui.open(`
        <h3>${u.esc(title)}</h3>
        <p>どれが うまれるかは おたのしみ。</p>
        <div class="egg-pick">${choices.map((sp, i) => `<button data-sp="${sp}" class="${i === 0 ? 'on' : ''}">${MM.art.html({ species: sp, stage: 0 }, { size: 84 })}${u.esc(MM.art.formName(sp, 0))}</button>`).join('')}</div>
        <div class="modal-actions"><button class="btn btn-primary" data-x="ok">このたまごにする</button></div>`, { center: true, locked: true });
      u.$$('.egg-pick button', ov).forEach((b) => {
        b.onclick = () => {
          pick = b.dataset.sp;
          u.$$('.egg-pick button', ov).forEach((x) => x.classList.toggle('on', x === b));
          MM.sfx.play('wobble');
          const mon = b.querySelector('.mon');
          if (mon) MM.fx.mood(mon, 'is-hatching', 350);
        };
      });
      ov.querySelector('[data-x="ok"]').onclick = () => {
        G.newEgg(pick);
        MM.ui.close(ov);
        MM.sfx.play('get');
        if (done) done();
